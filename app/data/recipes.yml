# Выход указан для количеств из dishes.yml. Время приблизительное, в минутах.

# Выпечка
pirozhki-s-yaitsom-i-lukom:
  portions: 6
  minutes: 120
  wholeBatch: true
  steps:
    - Замесите тесто из муки, тёплого молока, дрожжей, сахара, соли и растительного масла. Накройте и оставьте до заметного подъёма.
    - Одно яйцо оставьте для смазывания, остальные сварите вкрутую. Порубите их и зелёный лук, перемешайте с растопленным сливочным маслом.
    - Разделите тесто на лепёшки, заверните начинку и уложите швом вниз. Дайте постоять 15 минут, смажьте яйцом и выпекайте при 190 °C до румяности около 20 минут.
pirozhki-s-yablokom:
  portions: 6
  minutes: 120
  steps:
    - Из муки, тёплого молока, дрожжей, соли, растительного масла, яйца и половины сахара замесите мягкое тесто. Накройте и оставьте до подъёма.
    - Нарежьте яблоки мелкими кубиками, прогрейте с оставшимся сахаром и корицей, пока лишний сок не выпарится. Остудите начинку.
    - Заверните яблоки в порции теста, дайте пирожкам расстояться 15 минут и выпекайте при 190 °C около 20 минут до румяности.
sloiki-s-vishnei:
  portions: 8
  minutes: 50
  steps:
    - Вишню без косточек прогрейте с сахаром, вмешайте крахмал, разведённый в ложке холодной воды, и остудите загустевшую начинку.
    - Нарежьте размороженное тесто на прямоугольники, разложите начинку, защипните края и смажьте яйцом. Сделайте сверху надрезы и пеките при 200 °C 18–25 минут.
sharlotka:
  portions: 6
  minutes: 60
  wholeBatch: true
  steps:
    - Нарежьте яблоки дольками и выложите в форму, смазанную сливочным маслом. Разогрейте духовку до 180 °C.
    - Взбейте яйца с сахаром до светлой пышной массы. Лопаткой вмешайте просеянную муку и ванилин, залейте яблоки тестом.
    - Выпекайте примерно 35–45 минут, пока шпажка из середины пирога не выйдет без сырого теста. Дайте шарлотке немного остыть в форме.
sloiki-s-yablokom-i-koritsei:
  portions: 8
  minutes: 45
  steps:
    - Нарежьте яблоки и потушите в сливочном масле с сахаром и корицей. Когда жидкость выпарится, остудите начинку.
    - Нарежьте тесто, заверните начинку, хорошо защипните края и смажьте верх яйцом. Выпекайте при 200 °C 18–25 минут.
mannik:
  portions: 8
  minutes: 85
  wholeBatch: true
  steps:
    - Смешайте манку с кефиром и оставьте на 25–30 минут. Взбейте яйца с сахаром и соедините с манкой и растопленным маслом.
    - Вмешайте муку с разрыхлителем и ванилин. Вылейте тесто в форму и пеките при 180 °C около 35–45 минут до сухой шпажки.
pechene-sdobnoe:
  portions: 8
  minutes: 55
  steps:
    - Разотрите мягкое масло с сахаром, добавьте яйцо и ванилин. Вмешайте муку с разрыхлителем и охладите тесто около 20 минут.
    - Сформуйте печенье и разложите с промежутками на противне. Выпекайте при 180 °C 12–16 минут, пока края не подрумянятся.
keks:
  portions: 8
  minutes: 75
  wholeBatch: true
  steps:
    - Взбейте мягкое масло с сахаром. По одному вмешайте яйца, затем молоко, муку с разрыхлителем, ванилин и обсушенный изюм.
    - Переложите тесто в форму и пеките при 175 °C примерно 45–55 минут до сухой шпажки.
chebureki:
  portions: 4
  minutes: 65
  steps:
    - Замесите тесто из муки, воды и соли, накройте на 20 минут. Измельчите говядину и лук, посолите, вмешайте немного холодной воды для сочности.
    - Тонко раскатайте кружки, распределите фарш тонким слоем и защипните края. Жарьте в растительном масле с двух сторон до румяности и 71 °C в начинке.
pirog-s-persikami:
  portions: 8
  minutes: 65
  wholeBatch: true
  steps:
    - Разотрите мягкое масло с сахаром, вмешайте яйца по одному, добавьте муку с разрыхлителем и ванилин.
    - Выложите тесто в форму, разложите сверху дольки персиков. Выпекайте при 180 °C 35–45 минут до сухой шпажки.

tvorozhnaya-zapekanka:
  portions: 6
  minutes: 70
  wholeBatch: true
  steps:
    - Разомните творог с яйцами, сахаром, ванилином и щепоткой соли. Добавьте манку и часть сметаны, перемешайте и оставьте на 15 минут.
    - Смажьте форму сливочным маслом. Выложите творожную массу и распределите оставшуюся сметану по поверхности.
    - Выпекайте при 180 °C примерно 35–45 минут, пока верх не подрумянится и центр не схватится. Дайте запеканке немного остыть в форме.

# Завтраки
blini:
  portions: 4
  minutes: 35
  steps:
    - Взбейте яйца с сахаром и солью, влейте половину молока и вмешайте муку. Разведите оставшимся молоком, влейте масло и оставьте на 10 минут.
    - Половником налейте тонкий слой теста на горячую сковороду. Когда края схватятся, переверните блин и допеките вторую сторону.
oladi:
  portions: 4
  minutes: 30
  steps:
    - Перемешайте кефир, яйца, сахар и соль. Всыпьте муку с содой, быстро перемешайте и дайте густому тесту постоять 5 минут.
    - Выкладывайте тесто ложкой на сковороду с маслом. Жарьте на среднем огне с обеих сторон, чтобы середина успела пропечься.
sirniki:
  portions: 3
  minutes: 30
  steps:
    - Разомните творог, вмешайте яйцо, сахар, ванилин и часть муки. Сформуйте небольшие шайбы и обваляйте в оставшейся муке.
    - Обжарьте в масле на среднем огне с двух сторон до румяности и готовности в середине. Подавайте со сметаной.
mannaya-kasha:
  portions: 3
  minutes: 15
  steps:
    - Нагрейте молоко с сахаром и солью почти до кипения. Всыпьте манку тонкой струйкой, непрерывно перемешивая венчиком.
    - Варите на слабом огне 3–5 минут, выключите, добавьте масло и дайте каше постоять под крышкой.
ovsyanaya-kasha:
  portions: 2
  minutes: 15
  steps:
    - Всыпьте хлопья в горячее молоко, добавьте сахар и щепотку соли. Варите на слабом огне по времени на упаковке, помешивая.
    - Добавьте сливочное масло и дайте каше постоять пару минут.
yogurt:
  portions: 2
  minutes: 2
  steps:
    - Разложите охлаждённый йогурт по порциям непосредственно перед подачей.
glazunya:
  portions: 2
  minutes: 10
  steps:
    - Разогрейте масло на сковороде на среднем огне. Аккуратно разбейте яйца и посолите.
    - Убавьте огонь и готовьте до схватывания белка и желтка. При необходимости накройте крышкой.
skrembl-s-pomidorami:
  portions: 2
  minutes: 15
  steps:
    - Нарежьте помидоры и прогрейте их в сливочном масле, чтобы выпарить лишний сок. Взбейте яйца с молоком и солью.
    - Влейте яйца и перемешивайте лопаткой на слабом огне, пока смесь не схватится и не останется жидкого яйца.
pshenichnaya-kasha:
  portions: 3
  minutes: 35
  steps:
    - Промойте пшеничную крупу. Залейте молоком и водой в количестве с упаковки крупы, добавьте сахар и соль.
    - Томите на слабом огне, помешивая, до мягкости крупы. В конце вмешайте масло и оставьте под крышкой на 5 минут.
grenki:
  portions: 3
  minutes: 15
  steps:
    - Взбейте яйца с молоком и сахаром. Быстро обмакните ломтики хлеба с обеих сторон.
    - Обжарьте на сливочном масле на среднем огне до румяности и готовности яичной смеси.
goryachie-tosti-s-dzhemom:
  portions: 2
  minutes: 10
  steps:
    - Подрумяньте ломтики хлеба на сливочном масле в сковороде. Намажьте джемом горячие тосты перед подачей.
khlopya-s-molokom:
  portions: 2
  minutes: 5
  steps:
    - Разложите хлопья по мискам, залейте молоком и добавьте сахар по вкусу. Подавайте сразу, пока хлопья хрустят.
omlet:
  portions: 2
  minutes: 15
  steps:
    - Перемешайте яйца с молоком и солью. Растопите сливочное масло на сковороде.
    - Влейте смесь и готовьте под крышкой на слабом огне, пока омлет не схватится в центре.
tvorog:
  portions: 2
  minutes: 5
  steps:
    - Разомните творог вилкой. Добавьте сметану и сахар, перемешайте и разложите по порциям.
tvorozhnaya-massa:
  portions: 3
  minutes: 20
  steps:
    - Промойте изюм, ненадолго залейте тёплой водой и обсушите.
    - Взбейте творог со сметаной, сахаром и ванилином. Вмешайте изюм и охладите до подачи.

# Основные блюда
plov:
  portions: 5
  minutes: 70
  steps:
    - Промойте рис до прозрачной воды. Обжарьте в масле лук, кусочки курицы и морковь соломкой, всыпьте специи и добавьте чеснок.
    - Поверх мяса насыпьте рис ровным слоем, залейте горячей водой по указаниям для риса. Готовьте на слабом огне под крышкой, пока вода не впитается и курица не достигнет 74 °C.
    - Оставьте плов под крышкой на 10 минут, затем перемешайте.
lagman:
  portions: 5
  minutes: 95
  steps:
    - Обжарьте кубики говядины с луком. Добавьте морковь, перец, помидоры, чеснок и специи.
    - Влейте горячую воду, чтобы она покрыла мясо и овощи, и тушите до мягкости говядины.
    - Сварите лапшу отдельно, разложите по мискам и залейте мясной подливой.
kartoshka-zharenaya:
  portions: 4
  minutes: 35
  steps:
    - Нарежьте картофель и обсушите. Обжаривайте в хорошо разогретом масле, переворачивая, когда снизу появится корочка.
    - Добавьте нарезанный лук ближе к концу жарки. Доведите картофель до мягкости и посолите.
kartoshka-s-selyodkoi:
  portions: 4
  minutes: 35
  steps:
    - Отварите картофель до мягкости. Разделайте солёную селёдку на филе, уберите кости и нарежьте.
    - Подавайте горячий картофель с селёдкой и тонко нарезанным луком, полейте растительным маслом.
kuritsa-s-kartoshkoi-v-dukhovke:
  portions: 4
  minutes: 65
  steps:
    - Нарежьте картофель, лук и куриное филе. Перемешайте курицу со сметаной, чесноком и специями, а овощи с растительным маслом.
    - Выложите в форму и запекайте при 190 °C, пока картофель не станет мягким, а температура внутри курицы не достигнет 74 °C. Начните проверять через 40 минут.
gorokhovaya-kasha-s-myasom:
  portions: 5
  minutes: 85
  steps:
    - Промойте колотый горох и сварите на слабом огне в воде по инструкции на упаковке. В конце посолите и разомните до консистенции густой каши.
    - Нарежьте свинину небольшими кубиками и обжарьте в масле с луком. Добавьте немного воды и тушите под крышкой до мягкости мяса.
    - Разложите кашу по тарелкам и выложите сверху свинину с луком и подливой.
pelmeni:
  portions: 2
  minutes: 20
  steps:
    - Опустите готовые пельмени в кипящую подсоленную воду с лавровым листом. Перемешайте и варите по инструкции на упаковке.
    - Достаньте шумовкой и подавайте со сливочным маслом и сметаной.
chakhokhbili:
  portions: 4
  minutes: 50
  steps:
    - Подрумяньте крупные кусочки куриного филе в масле, добавьте нарезанный лук и готовьте до мягкости.
    - Добавьте рубленые помидоры, чеснок и специи. Тушите под крышкой до 74 °C в курице, затем посыпьте зеленью.
ragu:
  portions: 4
  minutes: 100
  steps:
    - Обжарьте кусочки говядины с луком. Добавьте немного горячей воды и лавровый лист, тушите до мягкости мяса.
    - Добавьте картофель, морковь, перец и помидоры. Тушите до готовности овощей и положите измельчённый чеснок в конце.

# Фрукты и овощи
banani: { portions: 4, minutes: 2, steps: [Очистите бананы непосредственно перед подачей.] }
greipfruti: { portions: 4, minutes: 5, steps: [Вымойте грейпфруты и разрежьте пополам или очистите дольки от плотных плёнок.] }
apelsini: { portions: 3, minutes: 5, steps: [Вымойте апельсины и нарежьте дольками или очистите перед подачей.] }
mandarini: { portions: 3, minutes: 5, steps: [Вымойте и очистите мандарины. Разделите на дольки.] }
yabloki: { portions: 4, minutes: 5, steps: [Вымойте яблоки. Подавайте целиком или нарежьте и удалите сердцевину.] }
grushi: { portions: 3, minutes: 5, steps: [Вымойте груши и удалите сердцевину при нарезке.] }
vinograd: { portions: 4, minutes: 5, steps: [Промойте виноград под проточной водой. Снимите ягоды с веточек.] }
kivi: { portions: 4, minutes: 5, steps: [Вымойте киви и разрежьте пополам или очистите и нарежьте.] }
avokado: { portions: 4, minutes: 5, steps: [Вымойте авокадо. Разрежьте вокруг косточки и выньте мякоть ложкой.] }
persiki: { portions: 4, minutes: 5, steps: [Вымойте персики. Разрежьте и удалите косточку.] }
khurma: { portions: 3, minutes: 5, steps: [Вымойте мягкую спелую хурму и удалите плодоножку и косточки.] }
slivi: { portions: 4, minutes: 5, steps: [Вымойте сливы. Разрежьте пополам и удалите косточки.] }
abrikosi: { portions: 4, minutes: 5, steps: [Вымойте абрикосы. Разделите пополам и уберите косточки.] }
nektarini: { portions: 4, minutes: 5, steps: [Вымойте нектарины и нарежьте дольками вокруг косточек.] }

# Гарниры
pyure:
  portions: 4
  minutes: 35
  steps:
    - Очистите и нарежьте картофель одинаковыми кусками. Отварите в подсоленной воде до мягкости, слейте воду.
    - Разомните горячий картофель с маслом и постепенно влейте подогретое молоко до нужной консистенции.
grechka:
  portions: 4
  minutes: 25
  steps:
    - Промойте гречку. Добавьте примерно два объёма воды на объём крупы, посолите и варите под крышкой на слабом огне до впитывания воды.
    - Добавьте сливочное масло и оставьте на несколько минут под крышкой.
ris:
  portions: 4
  minutes: 30
  steps:
    - Промойте рис. Возьмите воду в пропорции с упаковки и варите под крышкой на слабом огне до готовности.
    - Дайте рису постоять 5 минут, затем добавьте масло и разрыхлите вилкой.
makaroni:
  portions: 3
  minutes: 20
  steps:
    - Сварите макароны в кипящей подсоленной воде по инструкции на упаковке, откиньте на дуршлаг и перемешайте со сливочным маслом.
svezhie-ovoshchi:
  portions: 4
  minutes: 10
  steps:
    - Вымойте овощи и зелень. Нарежьте огурцы, помидоры и очищенный перец, разложите на тарелке с зеленью.
zamorozka-ovoshchnaya:
  portions: 3
  minutes: 15
  steps:
    - Приготовьте смесь по инструкции на упаковке. Если готовите на сковороде, прогрейте смесь в растительном масле до готовности и выпарите лишнюю воду.
lapsha:
  portions: 3
  minutes: 15
  steps:
    - Сварите лапшу до готовности по инструкции на упаковке. Слейте воду и перемешайте лапшу со сливочным маслом.
yachnevaya:
  portions: 4
  minutes: 35
  steps:
    - Промойте ячневую крупу и залейте водой по пропорции на упаковке. Посолите и варите на слабом огне, помешивая, до мягкости.
    - Добавьте сливочное масло и оставьте кашу под крышкой на 5 минут.
goroshek:
  portions: 4
  minutes: 15
  steps:
    - Свежий или замороженный горошек отварите до мягкости по инструкции на упаковке. Если горошек консервированный, слейте жидкость и прогрейте.
    - Смешайте горячий горошек со сливочным маслом.
varyonaya-kukuruza:
  portions: 2
  minutes: 25
  steps:
    - Снимите листья и волокна. Опустите молодые початки в кипящую воду и варите до мягкости зёрен, проверяя примерно через 10 минут.
    - Достаньте щипцами, смажьте сливочным маслом и посолите.
kapusta-tushyonaya:
  portions: 4
  minutes: 50
  steps:
    - Нашинкуйте капусту, нарежьте лук и натрите морковь. Обжарьте лук и морковь в масле, затем добавьте капусту.
    - Вмешайте томатную пасту с небольшим количеством воды, добавьте лавровый лист и тушите под крышкой до мягкости. Уберите лавровый лист перед подачей.

# Мясо и рыба
steiki:
  portions: 2
  minutes: 25
  steps:
    - Промокните стейки, посолите и обжарьте на хорошо разогретой сковороде в растительном масле с двух сторон.
    - В конце добавьте сливочное масло и чеснок, поливайте мясо маслом. Доведите середину до 63 °C и дайте стейкам отдохнуть минимум 3 минуты.
kotleti:
  portions: 4
  minutes: 40
  steps:
    - Замочите хлеб в молоке и отожмите. Соедините с фаршем, яйцом, мелко нарезанным луком и чесноком, посолите.
    - Сформуйте котлеты, обжарьте на растительном масле и доведите на умеренном огне до 71 °C в центре, если фарш из говядины или свинины, и до 74 °C, если в нём есть птица.
riba-belaya:
  portions: 3
  minutes: 25
  steps:
    - Обсушите филе, посолите, сбрызните лимоном и слегка обваляйте в муке.
    - Обжарьте в растительном масле до 63 °C в толстой части. Подавайте с оставшимся лимоном.
riba-krasnaya:
  portions: 3
  minutes: 25
  steps:
    - Смажьте филе маслом, посолите и выложите в форму кожей вниз. Запекайте при 190 °C до 63 °C в толстой части.
    - Сбрызните лимонным соком перед подачей.
gulyash:
  portions: 4
  minutes: 110
  steps:
    - Нарежьте говядину, подрумяньте в масле и добавьте лук с морковью. Вмешайте томатную пасту и муку.
    - Постепенно влейте горячую воду, перемешайте, добавьте лавровый лист. Тушите под крышкой до мягкости мяса.
kurinie-berda:
  portions: 3
  minutes: 50
  steps:
    - Натрите бёдра маслом, солью, чесноком и специями. Уложите в форму кожей вверх.
    - Запекайте при 200 °C до 74 °C в самой толстой части, измеряя вдали от кости.
kurinie-krilya:
  portions: 3
  minutes: 50
  steps:
    - Смешайте соевый соус, мёд, чеснок, масло и специи. Обмажьте крылья и разложите на противне.
    - Запекайте при 200 °C, перевернув один раз, до 74 °C в толстой части крыла. Обычно это занимает 30–40 минут.
kurinie-nogi:
  portions: 3
  minutes: 50
  steps:
    - Натрите голени смесью масла, соли, чеснока и специй. Разложите в форме с промежутками.
    - Запекайте при 200 °C до 74 °C в самой толстой части, не касаясь термометром кости.
kurinaya-grudka:
  portions: 3
  minutes: 35
  steps:
    - Смажьте грудку растительным маслом, натрите чесноком, солью и специями.
    - Запекайте при 190 °C до 74 °C в самой толстой части. Дайте постоять несколько минут перед нарезкой.
befstroganov:
  portions: 3
  minutes: 40
  steps:
    - Нарежьте говядину тонкими полосками поперёк волокон и быстро обжарьте порциями в масле. Отдельно обжарьте лук.
    - Добавьте к луку муку, томатную пасту, сметану и немного воды. Верните мясо и доведите его до готовности на слабом огне.
krevetki:
  portions: 3
  minutes: 20
  steps:
    - Разморозьте креветки в холодильнике и очистите. Растопите масло и коротко прогрейте нарезанный чеснок.
    - Добавьте креветки и готовьте до непрозрачной мякоти. Если креветки уже варёные, только прогрейте. Добавьте лимон и зелень.
krolik:
  portions: 4
  minutes: 105
  steps:
    - Разделите кролика на куски и обжарьте на масле. Добавьте лук, морковь, чеснок и лавровый лист.
    - Влейте сметану с небольшим количеством воды. Тушите под крышкой до мягкости мяса и температуры 71 °C внутри кусков.
utka:
  portions: 6
  minutes: 150
  wholeBatch: true
  steps:
    - Обсушите утку, натрите солью, чесноком и специями. Часть долек яблока положите внутрь, остальное разложите вокруг ближе к концу запекания.
    - Запекайте при 180 °C. Ближе к концу смажьте мёдом. Проверьте, что в грудке, бедре и яблоках внутри тушки температура достигла 74 °C.
    - Дайте утке постоять 10–15 минут, затем разрежьте и подавайте с яблоками.
bekon:
  portions: 4
  minutes: 15
  steps:
    - Разложите полоски на холодной сковороде в один слой. Готовьте на среднем огне с обеих сторон до румяности и выложите на бумажное полотенце.

# Салаты
ogurtsi-pomidori:
  portions: 4
  minutes: 15
  steps:
    - Нарежьте помидоры, огурцы и лук. Добавьте рубленую зелень и заправьте маслом и солью перед подачей.
koul-slou:
  portions: 4
  minutes: 20
  steps:
    - Тонко нашинкуйте капусту и натрите морковь.
    - Соедините майонез, сметану, горчицу, уксус и сахар. Перемешайте с овощами и попробуйте перед подачей.
svyokla-s-chesnokom-i-orekhami:
  portions: 4
  minutes: 75
  steps:
    - Отварите свёклу до мягкости, остудите, очистите и натрите.
    - Добавьте рубленые грецкие орехи, измельчённый чеснок и майонез. Перемешайте.
kapustnii-salat-vitaminnii-s-morkovkoi-y:
  portions: 4
  minutes: 20
  steps:
    - Нашинкуйте капусту и слегка разомните с солью. Натрите морковь и нарежьте яблоко соломкой.
    - Смешайте овощи и яблоко, заправьте соком лимона, сахаром и растительным маслом.
krabovii:
  portions: 5
  minutes: 40
  steps:
    - Отварите рис и яйца вкрутую, остудите. Слейте жидкость с кукурузы.
    - Нарежьте крабовые палочки, яйца и огурец. Смешайте с кукурузой, рисом и майонезом.
selyodka-pod-shuboi:
  portions: 6
  minutes: 130
  steps:
    - Отварите свёклу, картофель, морковь и яйца. Остудите, очистите и натрите по отдельности.
    - Очистите солёную селёдку от костей и нарежьте вместе с луком. Уложите слоями картофель, селёдку, лук, морковь, яйца и свёклу, распределяя майонез тонкими слоями.
    - Дайте салату пропитаться в холодильнике перед подачей.
olive:
  portions: 6
  minutes: 55
  steps:
    - Отварите картофель и морковь до мягкости, яйца вкрутую. Остудите и очистите.
    - Нарежьте овощи, яйца, колбасу и солёные огурцы кубиками. Добавьте мелко нарезанный лук и горошек без жидкости, заправьте майонезом.
s-kartoshkoi-i-yaitsom:
  portions: 4
  minutes: 40
  steps:
    - Отварите картофель до мягкости, яйца вкрутую. Остудите, очистите и нарежьте кубиками.
    - Добавьте измельчённый зелёный лук и заправьте майонезом.
grecheskii:
  portions: 4
  minutes: 15
  steps:
    - Крупно нарежьте помидоры, огурцы, перец и тонко нарежьте лук. Перемешайте с маслинами.
    - Выложите сверху фету и полейте оливковым маслом.
vinegret:
  portions: 5
  minutes: 75
  steps:
    - Отварите свёклу, картофель и морковь. Остудите, очистите и нарежьте кубиками.
    - Добавьте мелко нарезанные огурцы и лук, отжатую квашеную капусту и горошек. Заправьте растительным маслом.

# Супы
borshch:
  portions: 6
  minutes: 125
  steps:
    - Залейте говядину водой из расчёта примерно 300 мл на порцию. Снимите пену и варите на слабом огне до мягкости мяса.
    - Добавьте в бульон нарезанный картофель и нашинкованную капусту. Отдельно обжарьте лук, морковь и свёклу, добавьте томатную пасту и немного бульона.
    - Соедините зажарку с супом, добавьте лавровый лист и доведите овощи до готовности. В конце добавьте чеснок и зелень.
shchi:
  portions: 6
  minutes: 120
  steps:
    - Сварите бульон из говядины, взяв около 300 мл воды на порцию. Выньте мясо, нарежьте и верните в кастрюлю.
    - Добавьте картофель и капусту. Обжарьте лук с морковью и томатом. Переложите в кастрюлю и доварите с лавровым листом до мягкости овощей. Подавайте с зеленью.
gorokhovii:
  portions: 6
  minutes: 110
  steps:
    - Промойте колотый горох. Залейте горох и свинину примерно 300 мл воды на порцию и варите, снимая пену, до размягчения гороха.
    - Добавьте картофель, обжаренные лук и морковь и лавровый лист. Доварите до мягкости овощей и мяса.
solyanka:
  portions: 5
  minutes: 110
  steps:
    - Сварите говяжий бульон с лавровым листом, используя примерно 300 мл воды на порцию. Нарежьте сваренную говядину, колбасу и сосиски.
    - Припустите лук с солёными огурцами и томатной пастой. Верните мясо в бульон и добавьте зажарку и маслины. Прогрейте и подайте с лимоном.
ukha-po-finski:
  portions: 4
  minutes: 45
  steps:
    - Обжарьте лук и морковь в сливочном масле. Добавьте картофель, лавровый лист и примерно 250 мл воды на порцию. Варите до мягкости картофеля.
    - Добавьте кусочки рыбы и сливки, доведите до лёгкого кипения. Когда рыба достигнет 63 °C в толстой части, выключите огонь и добавьте зелень.
krem-sup-iz-chechevitsi:
  portions: 5
  minutes: 45
  steps:
    - Промойте чечевицу. Обжарьте лук, морковь и чеснок в масле со специями.
    - Добавьте чечевицу, нарезанный картофель и около 300 мл воды на порцию. Варите до мягкости, затем измельчите погружным блендером.
sup-iz-ribnoi-konservi:
  portions: 5
  minutes: 40
  steps:
    - Вскипятите примерно 300 мл воды на порцию. Добавьте картофель, промытый рис и лавровый лист.
    - Обжарьте лук и морковь, добавьте к почти готовым картофелю и рису. Положите рыбу из консервы и прогрейте несколько минут. Добавьте зелень.
kurinaya-lapsha:
  portions: 5
  minutes: 55
  steps:
    - Залейте куриное филе холодной водой из расчёта около 300 мл на порцию. Добавьте лавровый лист и сварите бульон до 74 °C внутри курицы.
    - Нарежьте курицу. В бульоне сварите картофель, обжаренные лук и морковь, добавьте лапшу по времени на её упаковке.
    - Верните курицу, тонкой струёй влейте взбитое яйцо и доведите до готовности. Подавайте с зеленью.
okroshka:
  portions: 5
  minutes: 50
  steps:
    - Отварите картофель и яйца, остудите и нарежьте кубиками. Так же нарежьте колбасу, огурцы и редис.
    - Добавьте рубленые зелёный лук и укроп. Размешайте горчицу в сметане, добавьте к овощам и залейте холодным квасом перед подачей.
