# Выход указан для количеств из dishes.yml. Время приблизительное, в минутах.

# Выпечка
pirozhki-s-yaitsom-i-lukom:
  portions: 6
  minutes: 120
  wholeBatch: true
  steps:
    - Соедините муку, тёплое молоко, сахар, соль и растительное масло. Добавьте дрожжи способом, указанным на упаковке. Вымесите тесто до гладкости, накройте и оставьте в тепле до увеличения примерно вдвое.
    - На каждые четыре яйца оставьте одно для смазывания, остальные сварите вкрутую. Порубите их и зелёный лук, перемешайте с растопленным сливочным маслом.
    - Разделите тесто на лепёшки, заверните начинку и уложите швом вниз. Дайте постоять 15 минут, смажьте яйцом и выпекайте при 190 °C до румяности около 20 минут.
pirozhki-s-yablokom:
  portions: 6
  minutes: 120
  steps:
    - Соедините муку, тёплое молоко, соль, растительное масло, яйцо и половину сахара. Добавьте дрожжи способом, указанным на упаковке. Вымесите мягкое тесто до гладкости, накройте и оставьте в тепле до увеличения примерно вдвое.
    - Нарежьте яблоки мелкими кубиками, прогрейте с оставшимся сахаром и корицей, пока лишний сок не выпарится. Остудите начинку.
    - Заверните яблоки в порции теста, дайте пирожкам расстояться 15 минут и выпекайте при 190 °C около 20 минут до румяности.
sloiki-s-vishnei:
  portions: 8
  minutes: 50
  steps:
    - Вишню без косточек прогрейте с сахаром. Разведите крахмал в холодной воде, взяв примерно столько же по объёму, влейте в вишню и прогрейте до загустения. Остудите начинку.
    - Если тесто заморожено, заранее разморозьте его по инструкции. Нарежьте холодное тесто на прямоугольники, разложите начинку, защипните края и смажьте яйцом. Сделайте сверху надрезы и пеките при 200 °C 18–25 минут.
sharlotka:
  portions: 6
  minutes: 60
  wholeBatch: true
  steps:
    - Нарежьте яблоки дольками и выложите в форму, смазанную сливочным маслом. Разогрейте духовку до 180 °C.
    - Взбейте яйца с сахаром до светлой пышной массы, на которой несколько секунд держится след венчика. Вмешайте просеянную муку и ванильный сахар лопаткой снизу вверх и сразу залейте яблоки тестом.
    - Выпекайте примерно 35–45 минут, пока шпажка из середины пирога не выйдет без сырого теста. Дайте шарлотке немного остыть в форме.
sloiki-s-yablokom-i-koritsei:
  portions: 8
  minutes: 45
  steps:
    - Нарежьте яблоки и потушите в сливочном масле с сахаром и корицей. Когда жидкость выпарится, остудите начинку.
    - Нарежьте тесто, заверните начинку, хорошо защипните края и смажьте верх яйцом. Выпекайте при 200 °C 18–25 минут.
mannik:
  portions: 8
  minutes: 85
  wholeBatch: true
  steps:
    - Смешайте манку с кефиром и оставьте на 25–30 минут. Взбейте яйца с сахаром и соедините с манкой и растопленным, слегка остывшим маслом.
    - Вмешайте муку с разрыхлителем и ванильный сахар. Вылейте тесто в форму и пеките при 180 °C около 35–45 минут до сухой шпажки.
pechene-sdobnoe:
  portions: 8
  minutes: 55
  steps:
    - Разотрите мягкое масло с сахаром, добавьте яйцо, соль и ванильный сахар. Быстро вмешайте муку с разрыхлителем и охладите тесто около 20 минут.
    - Сформуйте печенье и разложите с промежутками на противне. Выпекайте при 180 °C 12–16 минут, пока края не подрумянятся.
keks:
  portions: 8
  minutes: 75
  wholeBatch: true
  steps:
    - Взбейте мягкое масло с сахаром до светлой пышной массы, затем постепенно вмешайте яйца. Смешайте муку с разрыхлителем и ванильным сахаром, добавляйте эту смесь и молоко поочерёдно. В конце вмешайте обсушенный изюм.
    - Переложите тесто в форму и пеките при 175 °C примерно 45–55 минут до сухой шпажки.
chebureki:
  portions: 4
  minutes: 65
  steps:
    - Отложите примерно четверть воды для начинки. Из остальной воды, муки и соли замесите гладкое плотное тесто и оставьте под крышкой на 20 минут.
    - Измельчите говядину и лук, добавьте соль, чёрный перец и отложенную воду. Перемешайте фарш.
    - Тонко раскатайте кружки, распределите фарш тонким слоем и защипните края. Жарьте в растительном масле на среднем огне примерно 3–4 минуты с каждой стороны. Введите термощуп сбоку в начинку самого толстого чебурека. Она должна прогреться минимум до 71 °C.
pirog-s-persikami:
  portions: 8
  minutes: 65
  wholeBatch: true
  steps:
    - Разотрите мягкое масло с сахаром, вмешайте яйца по одному, добавьте муку с разрыхлителем и ванильный сахар.
    - Выложите тесто в форму, разложите сверху дольки персиков. Выпекайте при 180 °C 35–45 минут до сухой шпажки.

tvorozhnaya-zapekanka:
  portions: 6
  minutes: 70
  wholeBatch: true
  steps:
    - Разомните творог с яйцами, сахаром, ванильным сахаром и щепоткой соли. Добавьте манку и часть сметаны, перемешайте и оставьте на 15 минут.
    - Смажьте форму сливочным маслом. Выложите творожную массу и распределите оставшуюся сметану по поверхности.
    - Выпекайте при 180 °C примерно 35–45 минут, пока верх не подрумянится и центр не схватится. Дайте запеканке немного остыть в форме.

# Завтраки
blini:
  portions: 4
  minutes: 35
  steps:
    - Взбейте яйца с сахаром и солью, влейте половину молока и вмешайте муку. Разведите оставшимся молоком, влейте масло и оставьте на 10 минут.
    - Половником налейте тонкий слой теста на горячую сковороду. Когда края схватятся, переверните блин и допеките вторую сторону.
oladi:
  portions: 4
  minutes: 30
  steps:
    - Перемешайте кефир, яйца, сахар и соль. Смешайте муку с содой отдельно, затем быстро соедините с жидкой смесью и дайте густому тесту постоять 5 минут.
    - Выкладывайте тесто ложкой на сковороду с маслом. Жарьте на среднем огне с обеих сторон, чтобы середина успела пропечься.
sirniki:
  portions: 3
  minutes: 30
  steps:
    - Дайте стечь лишней сыворотке и разомните творог вилкой. Вмешайте яйцо, сахар, ванильный сахар и большую часть муки. Сформуйте небольшие шайбы и обваляйте в оставшейся муке.
    - Обжарьте в масле на среднем огне с двух сторон до румяности и готовности в середине. Подавайте со сметаной.
mannaya-kasha:
  portions: 3
  minutes: 15
  steps:
    - Нагрейте молоко с сахаром и солью почти до кипения. Всыпьте манку тонкой струйкой, непрерывно перемешивая венчиком.
    - Варите на слабом огне 3–5 минут, выключите, добавьте масло и дайте каше постоять под крышкой.
ovsyanaya-kasha:
  portions: 2
  minutes: 15
  steps:
    - Всыпьте хлопья в горячее молоко, добавьте сахар и щепотку соли. Варите на слабом огне по времени на упаковке, помешивая.
    - Добавьте сливочное масло и дайте каше постоять пару минут.
yogurt:
  portions: 2
  minutes: 2
  steps:
    - Разложите охлаждённый йогурт по порциям непосредственно перед подачей.
glazunya:
  portions: 2
  minutes: 10
  steps:
    - Разогрейте масло на сковороде на среднем огне. Аккуратно разбейте яйца и посолите.
    - Убавьте огонь и готовьте до схватывания белка и желтка. При необходимости накройте крышкой.
skrembl-s-pomidorami:
  portions: 2
  minutes: 15
  steps:
    - Нарежьте помидоры и прогрейте их в сливочном масле, чтобы выпарить лишний сок. Взбейте яйца с молоком и солью.
    - Влейте яйца и перемешивайте лопаткой на слабом огне, пока смесь не схватится и не останется жидкого яйца.
pshenichnaya-kasha:
  portions: 3
  minutes: 35
  steps:
    - Промойте пшеничную крупу. Залейте отмеренными водой и молоком, добавьте сахар и соль и доведите до слабого кипения.
    - Томите на слабом огне, помешивая, до мягкости крупы. В конце вмешайте масло и оставьте под крышкой на 5 минут.
grenki:
  portions: 3
  minutes: 15
  steps:
    - Взбейте яйца с молоком и сахаром. Быстро обмакните ломтики хлеба с обеих сторон.
    - Обжарьте на сливочном масле на среднем огне до румяности и готовности яичной смеси.
goryachie-tosti-s-dzhemom:
  portions: 2
  minutes: 10
  steps:
    - Подрумяньте ломтики хлеба на сливочном масле в сковороде. Намажьте джемом горячие тосты перед подачей.
khlopya-s-molokom:
  portions: 2
  minutes: 5
  steps:
    - Разложите хлопья по мискам, залейте молоком и добавьте сахар по вкусу. Подавайте сразу, пока хлопья хрустят.
omlet:
  portions: 2
  minutes: 15
  steps:
    - Перемешайте яйца с молоком и солью. Растопите сливочное масло на сковороде.
    - Влейте смесь и готовьте под крышкой на слабом огне, пока омлет не схватится в центре.
tvorog:
  portions: 2
  minutes: 5
  steps:
    - Разомните творог вилкой. Добавьте сметану и сахар, перемешайте и разложите по порциям.
tvorozhnaya-massa:
  portions: 3
  minutes: 20
  steps:
    - Промойте изюм, ненадолго залейте тёплой водой и обсушите.
    - Взбейте творог со сметаной, сахаром и ванильным сахаром. Вмешайте изюм и охладите до подачи.

# Основные блюда
plov:
  portions: 5
  minutes: 70
  steps:
    - Промойте рис до прозрачной воды. Обжарьте в масле лук, кусочки курицы и морковь соломкой, всыпьте специи и добавьте чеснок.
    - Поверх мяса насыпьте рис ровным слоем, залейте горячей водой по указаниям на упаковке. Томите под крышкой на слабом огне, пока вода не впитается. Для белого риса ориентир — 18–25 минут после закипания. Термощуп в центре самого крупного куска курицы должен показать не ниже 74 °C.
    - Оставьте плов под крышкой на 10 минут, затем перемешайте.
lagman:
  portions: 5
  minutes: 95
  steps:
    - Обжарьте кубики говядины с луком. Добавьте морковь, перец, помидоры, чеснок и специи.
    - Влейте горячую воду, чтобы она покрыла мясо и овощи, и тушите до мягкости говядины.
    - Сварите лапшу отдельно, разложите по мискам и залейте мясной подливой.
kartoshka-zharenaya:
  portions: 4
  minutes: 35
  steps:
    - Нарежьте картофель и обсушите. Обжаривайте в хорошо разогретом масле, переворачивая, когда снизу появится корочка.
    - Добавьте нарезанный лук ближе к концу жарки. Доведите картофель до мягкости и посолите.
kartoshka-s-selyodkoi:
  portions: 4
  minutes: 35
  steps:
    - Отварите картофель до мягкости. Разделайте солёную селёдку на филе, уберите кости и нарежьте.
    - Подавайте горячий картофель с селёдкой и тонко нарезанным луком, полейте растительным маслом.
kuritsa-s-kartoshkoi-v-dukhovke:
  portions: 4
  minutes: 65
  steps:
    - Нарежьте картофель дольками толщиной около 2 см, лук полукольцами, куриное филе кусочками по 3–4 см. Перемешайте курицу со сметаной, чесноком и специями, а овощи с растительным маслом.
    - Выложите в форму и запекайте при 190 °C примерно 40–50 минут. Картофель должен легко прокалываться ножом. Проверьте термощупом центр самого толстого куска курицы — минимум 74 °C. Если курица готова раньше, её можно вынуть и допечь картофель отдельно.
gorokhovaya-kasha-s-myasom:
  portions: 5
  minutes: 85
  steps:
    - Промойте колотый горох и сварите на слабом огне в воде по инструкции на упаковке. В конце посолите и разомните до консистенции густой каши.
    - Нарежьте свинину небольшими кубиками и обжарьте в масле с луком. Добавьте немного воды и тушите под крышкой до мягкости мяса.
    - Разложите кашу по тарелкам и выложите сверху свинину с луком и подливой.
pelmeni:
  portions: 2
  minutes: 20
  steps:
    - Опустите готовые пельмени в кипящую подсоленную воду с лавровым листом. Перемешайте и варите по инструкции на упаковке.
    - Достаньте шумовкой и подавайте со сливочным маслом и сметаной.
chakhokhbili:
  portions: 4
  minutes: 50
  steps:
    - Нарежьте куриное филе кусочками по 3–4 см и подрумяньте в масле. Добавьте нарезанный лук и готовьте до мягкости лука.
    - Добавьте рубленые помидоры, чеснок и специи. После закипания тушите под крышкой на слабом огне примерно 15–20 минут. Проверьте термощупом центр самого крупного куска курицы — минимум 74 °C. Затем посыпьте зеленью.
ragu:
  portions: 4
  minutes: 100
  steps:
    - Обжарьте кусочки говядины с луком. Добавьте немного горячей воды и лавровый лист, тушите до мягкости мяса.
    - Добавьте картофель, морковь, перец и помидоры. Тушите до готовности овощей и положите измельчённый чеснок в конце.

# Фрукты и овощи
banani: { portions: 4, minutes: 2, steps: [Очистите бананы непосредственно перед подачей.] }
greipfruti: { portions: 4, minutes: 5, steps: [Вымойте грейпфруты и разрежьте пополам или очистите дольки от плотных плёнок.] }
apelsini: { portions: 3, minutes: 5, steps: [Вымойте апельсины и нарежьте дольками или очистите перед подачей.] }
mandarini: { portions: 3, minutes: 5, steps: [Вымойте и очистите мандарины. Разделите на дольки.] }
yabloki: { portions: 4, minutes: 5, steps: [Вымойте яблоки. Подавайте целиком или нарежьте и удалите сердцевину.] }
grushi: { portions: 3, minutes: 5, steps: [Вымойте груши и удалите сердцевину при нарезке.] }
vinograd: { portions: 4, minutes: 5, steps: [Промойте виноград под проточной водой. Снимите ягоды с веточек.] }
kivi: { portions: 4, minutes: 5, steps: [Вымойте киви и разрежьте пополам или очистите и нарежьте.] }
avokado: { portions: 4, minutes: 5, steps: [Вымойте авокадо. Разрежьте вокруг косточки и выньте мякоть ложкой.] }
persiki: { portions: 4, minutes: 5, steps: [Вымойте персики. Разрежьте и удалите косточку.] }
khurma: { portions: 3, minutes: 5, steps: [Вымойте мягкую спелую хурму и удалите плодоножку и косточки.] }
slivi: { portions: 4, minutes: 5, steps: [Вымойте сливы. Разрежьте пополам и удалите косточки.] }
abrikosi: { portions: 4, minutes: 5, steps: [Вымойте абрикосы. Разделите пополам и уберите косточки.] }
nektarini: { portions: 4, minutes: 5, steps: [Вымойте нектарины и нарежьте дольками вокруг косточек.] }

# Гарниры
pyure:
  portions: 4
  minutes: 35
  steps:
    - Очистите и нарежьте картофель одинаковыми кусками. Отварите в подсоленной воде до мягкости, слейте воду.
    - Разомните горячий картофель с маслом и постепенно влейте подогретое молоко до нужной консистенции.
grechka:
  portions: 4
  minutes: 25
  steps:
    - Промойте гречку. Добавьте примерно два объёма воды на объём крупы, посолите и варите под крышкой на слабом огне до впитывания воды.
    - Добавьте сливочное масло и оставьте на несколько минут под крышкой.
ris:
  portions: 4
  minutes: 30
  steps:
    - Промойте рис. Возьмите воду в пропорции с упаковки и варите под крышкой на слабом огне до готовности.
    - Дайте рису постоять 5 минут, затем добавьте масло и разрыхлите вилкой.
makaroni:
  portions: 3
  minutes: 20
  steps:
    - Сварите макароны в кипящей подсоленной воде. Покупные готовьте по упаковке, свежие начните проверять через 2–3 минуты. Откиньте на дуршлаг и перемешайте со сливочным маслом.
svezhie-ovoshchi:
  portions: 4
  minutes: 10
  steps:
    - Вымойте овощи и зелень. Нарежьте огурцы, помидоры и очищенный перец, разложите на тарелке с зеленью.
zamorozka-ovoshchnaya:
  portions: 3
  minutes: 15
  steps:
    - Готовьте смесь на сковороде в растительном масле по указаниям на упаковке. Когда овощи полностью приготовятся, выпарите лишнюю воду и посолите.
lapsha:
  portions: 3
  minutes: 15
  steps:
    - Сварите лапшу до готовности. Покупную готовьте по упаковке, свежую начните проверять через 2–3 минуты. Слейте воду и перемешайте со сливочным маслом.
yachnevaya:
  portions: 4
  minutes: 35
  steps:
    - Промойте ячневую крупу и залейте водой по пропорции на упаковке. Посолите и варите на слабом огне, помешивая, до мягкости.
    - Добавьте сливочное масло и оставьте кашу под крышкой на 5 минут.
goroshek:
  portions: 4
  minutes: 15
  steps:
    - Свежий или замороженный горошек отварите до мягкости по инструкции на упаковке. Если горошек консервированный, слейте жидкость и прогрейте.
    - Смешайте горячий горошек со сливочным маслом и посолите.
varyonaya-kukuruza:
  portions: 2
  minutes: 25
  steps:
    - Снимите листья и волокна. Опустите молодые початки в кипящую воду и варите до мягкости зёрен, проверяя примерно через 10 минут.
    - Достаньте щипцами, смажьте сливочным маслом и посолите.
kapusta-tushyonaya:
  portions: 4
  minutes: 50
  steps:
    - Нашинкуйте капусту, нарежьте лук и натрите морковь. Обжарьте лук и морковь в масле, затем добавьте капусту.
    - Вмешайте томатную пасту с небольшим количеством воды, добавьте лавровый лист и тушите под крышкой до мягкости. Уберите лавровый лист перед подачей.

bulgur:
  portions: 3
  minutes: 25
  steps:
    - Растопите масло в небольшой кастрюле. Всыпьте булгур и прогрейте 1–2 минуты, помешивая.
    - Влейте отмеренную горячую воду, посолите и доведите до кипения. Накройте и варите на слабом огне до мягкости и впитывания воды. Для средней крупы начните проверять через 12–15 минут.
    - Выключите огонь, оставьте под крышкой на 5 минут и разрыхлите вилкой.
brokkoli-v-dukhovke:
  portions: 3
  minutes: 30
  steps:
    - Разогрейте духовку до 220 °C. Вымойте и обсушите брокколи, разберите её на соцветия примерно одного размера.
    - Перемешайте брокколи с оливковым маслом и солью, разложите в один слой. Запекайте 15–20 минут, пока ножки не станут мягкими, а верхушки не подрумянятся. Измельчённый чеснок добавьте за 5 минут до конца.
    - Сбрызните горячую брокколи лимонным соком.
tsvetnaya-kapusta-s-paprikoy:
  portions: 3
  minutes: 35
  steps:
    - Разогрейте духовку до 220 °C. Вымойте, обсушите и разберите капусту на соцветия.
    - Перемешайте с растительным маслом, паприкой и солью. Разложите на противне в один слой и запекайте 20–25 минут, один раз перевернув. Готовая капуста легко прокалывается вилкой.
kartofel-dolkami:
  portions: 3
  minutes: 45
  steps:
    - Разогрейте духовку до 220 °C. Вымойте картофель, нарежьте вдоль на одинаковые дольки и обсушите.
    - Перемешайте с маслом, паприкой и солью. Разложите одним слоем на противне, оставляя промежутки.
    - Запекайте 30–35 минут, перевернув примерно в середине. Проверьте, что дольки подрумянились снаружи и стали мягкими внутри.

# Мясо и рыба
steiki:
  portions: 2
  minutes: 25
  steps:
    - Промокните стейки, посолите и обжарьте на хорошо разогретой сковороде в растительном масле с двух сторон.
    - В конце добавьте сливочное масло и чеснок, поливайте мясо маслом. Введите термощуп сбоку до центра стейка, доведите середину до 63 °C и дайте мясу отдохнуть минимум 3 минуты.
kotleti:
  portions: 4
  minutes: 40
  steps:
    - Замочите хлеб в молоке и отожмите. Соедините с фаршем, яйцом, мелко нарезанным луком и чесноком, посолите.
    - Сформуйте котлеты толщиной около 2 см и жарьте на растительном масле на среднем огне примерно по 5–7 минут с каждой стороны. Введите термощуп сбоку в центр самой толстой котлеты. Для говядины и свинины нужно минимум 71 °C, для фарша с птицей — минимум 74 °C.
riba-belaya:
  portions: 3
  minutes: 25
  steps:
    - Обсушите филе, посолите, сбрызните лимоном и слегка обваляйте в муке.
    - Жарьте в растительном масле на среднем огне. Для филе толщиной около 2 см ориентир — 3–4 минуты с каждой стороны. Термощуп в самой толстой части должен показать минимум 63 °C. Подавайте с оставшимся лимоном.
riba-krasnaya:
  portions: 3
  minutes: 25
  steps:
    - Смажьте филе маслом, посолите и выложите в форму кожей вниз. Запекайте при 190 °C примерно 12–18 минут для кусков толщиной 2–3 см. Проверьте термощупом самую толстую часть — минимум 63 °C.
    - Сбрызните лимонным соком перед подачей.
gulyash:
  portions: 4
  minutes: 110
  steps:
    - Нарежьте говядину, подрумяньте в масле и добавьте лук с морковью. Вмешайте томатную пасту и муку.
    - Постепенно влейте горячую воду, перемешайте, добавьте лавровый лист. Тушите под крышкой до мягкости мяса.
kurinie-berda:
  portions: 3
  minutes: 50
  steps:
    - Натрите бёдра маслом, солью, чесноком и специями. Уложите в форму кожей вверх.
    - Запекайте бёдра на кости при 200 °C примерно 35–45 минут. Введите термощуп в самую толстую часть мяса, не касаясь кости. Нужно минимум 74 °C.
kurinie-krilya:
  portions: 3
  minutes: 50
  steps:
    - Смешайте соевый соус, мёд, чеснок, масло и специи. Обмажьте крылья и разложите на противне.
    - Запекайте при 200 °C примерно 30–40 минут, один раз перевернув. Проверьте термощупом самую мясистую часть крыла вдали от кости — минимум 74 °C.
kurinie-nogi:
  portions: 3
  minutes: 50
  steps:
    - Натрите голени смесью масла, соли, чеснока и специй. Разложите в форме с промежутками.
    - Запекайте при 200 °C примерно 35–45 минут. Введите термощуп в самое толстое место голени, не касаясь кости. Нужно минимум 74 °C.
kurinaya-grudka:
  portions: 3
  minutes: 50
  steps:
    - Смажьте грудку растительным маслом, натрите чесноком, солью и специями.
    - Запекайте при 190 °C. Для филе толщиной 2–3 см ориентир — 20–30 минут, для грудки на кости — 35–45 минут. Термощуп в центре самой толстой части должен показать минимум 74 °C. Дайте грудке постоять несколько минут перед нарезкой.
befstroganov:
  portions: 3
  minutes: 40
  steps:
    - Нарежьте говядину тонкими полосками поперёк волокон и быстро обжарьте порциями в масле. Отдельно обжарьте лук.
    - Добавьте к луку муку, томатную пасту, сметану и немного воды. Верните мясо и доведите его до готовности на слабом огне.
krevetki:
  portions: 3
  minutes: 20
  timeNote: без размораживания
  steps:
    - Замороженные креветки заранее разморозьте в холодильнике. Очистите их, растопите масло и коротко прогрейте нарезанный чеснок.
    - Добавьте креветки и готовьте до непрозрачной мякоти. Если креветки уже варёные, только прогрейте. Добавьте лимон и зелень.
krolik:
  portions: 4
  minutes: 105
  steps:
    - Разделите кролика на куски и обжарьте на масле. Добавьте лук, морковь, чеснок и лавровый лист.
    - Влейте сметану с небольшим количеством воды. Тушите под крышкой на слабом огне примерно 60–80 минут до мягкости. Термощуп в самой толстой части мяса вдали от кости должен показать минимум 71 °C.
utka:
  portions: 6
  minutes: 180
  wholeBatch: true
  steps:
    - Обсушите утку, натрите солью, чесноком и специями. Положите внутрь несколько долек яблока свободно, остальное разложите вокруг за 25–30 минут до конца запекания.
    - Запекайте при 180 °C. Для утки весом около 2 кг ориентир — 130–160 минут. Ближе к концу смажьте мёдом. Термощуп должен показать минимум 74 °C в толстой части грудки, во внутренних частях бедра и крыла и в центре яблок внутри утки. При измерении не касайтесь костей.
    - Дайте утке постоять 10–15 минут, затем разрежьте и подавайте с яблоками.
bekon:
  portions: 4
  minutes: 15
  steps:
    - Разложите полоски на холодной сковороде в один слой. Готовьте на среднем огне с обеих сторон до румяности и выложите на бумажное полотенце.

# Салаты
ogurtsi-pomidori:
  portions: 4
  minutes: 15
  steps:
    - Нарежьте помидоры, огурцы и лук. Добавьте рубленую зелень и заправьте маслом и солью перед подачей.
koul-slou:
  portions: 4
  minutes: 20
  steps:
    - Тонко нашинкуйте капусту и натрите морковь.
    - Соедините майонез, сметану, горчицу, уксус и сахар. Перемешайте с овощами и попробуйте перед подачей.
svyokla-s-chesnokom-i-orekhami:
  portions: 4
  minutes: 75
  steps:
    - Отварите свёклу до мягкости, остудите, очистите и натрите.
    - Добавьте рубленые грецкие орехи, измельчённый чеснок и майонез. Перемешайте.
kapustnii-salat-vitaminnii-s-morkovkoi-y:
  portions: 4
  minutes: 20
  steps:
    - Нашинкуйте капусту и слегка разомните с солью. Натрите морковь и нарежьте яблоко соломкой.
    - Смешайте овощи и яблоко, заправьте соком лимона, сахаром и растительным маслом.
krabovii:
  portions: 5
  minutes: 40
  steps:
    - Отварите яйца вкрутую и остудите. Рис отварите отдельно, разложите тонким слоем в чистой ёмкости и быстро охладите, желательно в течение часа. Держите его в холодильнике до смешивания. Слейте жидкость с кукурузы.
    - Нарежьте крабовые палочки, яйца и огурец. Смешайте с кукурузой, рисом и майонезом.
selyodka-pod-shuboi:
  portions: 6
  minutes: 130
  steps:
    - Отварите свёклу, картофель, морковь и яйца. Остудите, очистите и натрите по отдельности.
    - Очистите солёную селёдку от костей и нарежьте вместе с луком. Уложите слоями картофель, селёдку, лук, морковь, яйца и свёклу, распределяя майонез тонкими слоями.
    - Дайте салату пропитаться в холодильнике перед подачей.
olive:
  portions: 6
  minutes: 55
  steps:
    - Отварите картофель и морковь до мягкости, яйца вкрутую. Остудите и очистите.
    - Нарежьте овощи, яйца, колбасу и солёные огурцы кубиками. Добавьте лук и консервированный горошек без жидкости. Если горошек замороженный, приготовьте его по инструкции и остудите. Заправьте майонезом.
s-kartoshkoi-i-yaitsom:
  portions: 4
  minutes: 40
  steps:
    - Отварите картофель до мягкости, яйца вкрутую. Остудите, очистите и нарежьте кубиками.
    - Добавьте измельчённый зелёный лук и заправьте майонезом.
grecheskii:
  portions: 4
  minutes: 15
  steps:
    - Крупно нарежьте помидоры, огурцы, перец и тонко нарежьте лук. Перемешайте с маслинами.
    - Выложите сверху фету и полейте оливковым маслом.
vinegret:
  portions: 5
  minutes: 75
  steps:
    - Отварите свёклу, картофель и морковь. Остудите, очистите и нарежьте кубиками.
    - Добавьте мелко нарезанные огурцы и лук, отжатую квашеную капусту и консервированный горошек без жидкости. Если горошек замороженный, приготовьте его по инструкции и остудите. Заправьте растительным маслом.

rukola-s-cherri-i-fetoy:
  portions: 2
  minutes: 10
  steps:
    - Вымойте и обсушите рукколу и помидоры. Разрежьте черри пополам, нарежьте фету кубиками.
    - Взбейте вилкой оливковое масло с лимонным соком. Перемешайте с рукколой и помидорами непосредственно перед подачей, сверху разложите фету.
rukola-s-grushey-i-orekhami:
  portions: 2
  minutes: 12
  steps:
    - Вымойте и обсушите рукколу. У груши удалите сердцевину, нарежьте её тонкими дольками и сбрызните частью лимонного сока.
    - Крупно порубите орехи. Выложите грушу и орехи на рукколу и полейте оставшимся лимонным соком, смешанным с оливковым маслом.
salat-s-redisom-i-ogurtsom:
  portions: 3
  minutes: 12
  steps:
    - Вымойте редис, огурцы и укроп. Нарежьте редис и огурцы тонкими кружками, мелко нарежьте укроп.
    - Смешайте овощи и укроп со сметаной и добавьте соль перед подачей.
salat-s-nutom:
  portions: 3
  minutes: 15
  steps:
    - Слейте жидкость с нута, промойте его и дайте воде стечь. Вымойте овощи и зелень.
    - Нарежьте огурец и помидоры кубиками, порубите зелень. Смешайте с нутом и заправьте оливковым маслом, лимонным соком и солью.

# Супы
borshch:
  portions: 6
  minutes: 125
  steps:
    - Залейте говядину водой из расчёта примерно 300 мл на порцию. Снимите пену и варите на слабом огне до мягкости мяса.
    - Добавьте в бульон нарезанный картофель и нашинкованную капусту. Отдельно обжарьте лук, морковь и свёклу, добавьте томатную пасту и немного бульона.
    - Соедините зажарку с супом, добавьте лавровый лист и доведите овощи до готовности. В конце добавьте чеснок и зелень.
shchi:
  portions: 6
  minutes: 120
  steps:
    - Сварите бульон из говядины, взяв около 300 мл воды на порцию. Выньте мясо, нарежьте и верните в кастрюлю.
    - Добавьте картофель и капусту. Обжарьте лук с морковью и томатом. Переложите в кастрюлю и доварите с лавровым листом до мягкости овощей. Подавайте с зеленью.
gorokhovii:
  portions: 6
  minutes: 110
  steps:
    - Промойте колотый горох. Залейте горох и свинину примерно 300 мл воды на порцию и варите, снимая пену, до размягчения гороха.
    - Добавьте картофель, обжаренные лук и морковь и лавровый лист. Доварите до мягкости овощей и мяса.
solyanka:
  portions: 5
  minutes: 110
  steps:
    - Сварите говяжий бульон с лавровым листом, используя примерно 300 мл воды на порцию. Нарежьте сваренную говядину, колбасу и сосиски.
    - Припустите лук с солёными огурцами и томатной пастой. Верните мясо в бульон и добавьте зажарку и маслины. Прогрейте и подайте с лимоном.
ukha-po-finski:
  portions: 4
  minutes: 45
  steps:
    - Обжарьте лук и морковь в сливочном масле. Добавьте картофель, лавровый лист и примерно 250 мл воды на порцию. Варите до мягкости картофеля.
    - Добавьте сливки и рыбу, нарезанную кусочками по 2–3 см. Варите при слабом кипении примерно 5–8 минут. Проверьте термощупом середину самого крупного куска — минимум 63 °C. Выключите огонь и добавьте зелень.
krem-sup-iz-chechevitsi:
  portions: 5
  minutes: 45
  steps:
    - Промойте чечевицу. Обжарьте лук, морковь и чеснок в масле со специями.
    - Добавьте чечевицу, нарезанный картофель и около 300 мл воды на порцию. Варите до мягкости, затем измельчите погружным блендером.
sup-iz-ribnoi-konservi:
  portions: 5
  minutes: 40
  steps:
    - Вскипятите примерно 300 мл воды на порцию. Добавьте картофель, промытый рис и лавровый лист.
    - Обжарьте лук и морковь, добавьте к почти готовым картофелю и рису. Положите рыбу из консервы и прогрейте несколько минут. Добавьте зелень.
kurinaya-lapsha:
  portions: 5
  minutes: 55
  steps:
    - Залейте куриное филе холодной водой из расчёта около 300 мл на порцию и добавьте лавровый лист. После закипания варите на слабом огне примерно 20–25 минут. Проверьте термощупом центр самого толстого куска филе — минимум 74 °C.
    - Нарежьте курицу. В бульоне сварите картофель, обжаренные лук и морковь, затем добавьте лапшу. Покупную готовьте по упаковке, свежую начните проверять через пару минут.
    - Верните курицу, тонкой струёй влейте взбитое яйцо и доведите до готовности. Подавайте с зеленью.
okroshka:
  portions: 5
  minutes: 50
  steps:
    - Отварите картофель и яйца, остудите и нарежьте кубиками. Так же нарежьте колбасу, огурцы и редис.
    - Добавьте рубленые зелёный лук и укроп. Размешайте горчицу в сметане, добавьте к овощам и залейте холодным квасом перед подачей.

# Домашняя кухня, десерты и детские блюда
ratatouille:
  portions: 4
  minutes: 45
  steps:
    - "Нарежьте баклажан, кабачок и перец кубиками, помидоры порубите. Мелко нарежьте лук и чеснок."
    - "Прогрейте лук в масле 4–5 минут, затем добавьте баклажан и перец. Готовьте 7–8 минут, помешивая."
    - "Добавьте кабачок, помидоры и чеснок. Томите под крышкой 15 минут, затем снимите крышку и готовьте ещё 5–10 минут, пока овощи не станут мягкими, а лишний сок не выпарится. Посолите по вкусу."
minestrone-belaya-fasol:
  portions: 4
  minutes: 45
  steps:
    - "Слейте жидкость с фасоли и промойте её. Лук, морковь, кабачок и помидоры нарежьте мелким кубиком, чеснок порубите."
    - "В кастрюле прогрейте в масле лук и морковь 5 минут. Добавьте чеснок, помидоры, кабачок и воду. Варите при слабом кипении около 18 минут до мягкости овощей."
    - "Всыпьте фасоль, варите ещё 5 минут и приправьте солью. При подаче добавьте рубленую зелень."
pastushiy-pirog-indeyka:
  portions: 4
  minutes: 65
  wholeBatch: true
  steps:
    - "Очищенный картофель нарежьте и варите до мягкости 15–20 минут. Слейте воду, добавьте тёплое молоко и разомните в пюре."
    - "Мелко нарежьте лук и морковь, прогрейте в масле 5 минут. Добавьте фарш и разомните лопаткой. Вмешайте томатную пасту и воду, тушите 10–15 минут до мягкости овощей, посолите."
    - "Переложите начинку в форму, распределите пюре сверху и проведите по нему вилкой. Запекайте при 210 °C примерно 15–20 минут до лёгкой корочки. Введите термощуп через пюре в центр начинки из индейки. Нужно минимум 74 °C."
fish-chips-duhovka:
  portions: 4
  minutes: 45
  steps:
    - "Разогрейте духовку до 220 °C. Нарежьте картофель дольками, обсушите, перемешайте с маслом и щепоткой соли. Разложите в один слой и пеките 18 минут."
    - "Обсушите филе и проверьте, что в нём нет костей. Окуните порционные куски во взбитое яйцо, затем обваляйте в сухарях."
    - "Переверните картофель, положите рыбу на второй противень и запекайте ещё примерно 12–16 минут. Проверьте картофель ножом, а рыбу — термощупом. В самом толстом месте рыбы нужно минимум 63 °C. Подавайте с лимоном."
chili-indeyka-fasol:
  portions: 4
  minutes: 40
  steps:
    - "Нарежьте лук, перец и помидоры, порубите чеснок. Слейте жидкость с фасоли и промойте её."
    - "Прогрейте лук и перец с маслом около 5 минут. Добавьте чеснок, сладкую паприку и фарш. Разбейте комки лопаткой, затем вмешайте томатную пасту, помидоры и воду."
    - "Тушите при слабом кипении около 15 минут, затем добавьте фасоль и готовьте ещё примерно 5 минут. Проверьте термощупом в нескольких местах густой части чили с фаршем — минимум 74 °C. Посолите по вкусу."
kuritsa-kukuruza-kartofel:
  portions: 4
  minutes: 50
  steps:
    - "Разогрейте духовку до 210 °C. Нарежьте картофель дольками, перемешайте с половиной масла, частью паприки и щепоткой соли. Разложите на противне и запекайте 15 минут."
    - "Разрежьте очищенные початки пополам. Выровняйте филе по толщине, крупные куски разрежьте вдоль. Смажьте курицу оставшимся маслом, приправьте паприкой."
    - "Переверните картофель и добавьте курицу и кукурузу. Запекайте ещё примерно 18–25 минут. Проверьте термощупом центр самого толстого куска курицы — минимум 74 °C. Если нужно, допеките овощи отдельно."
yablochno-ovsyaniy-krambl:
  portions: 4
  minutes: 45
  steps:
    - "Вырежьте сердцевины, нарежьте яблоки тонкими дольками. Перемешайте их с корицей и водой в небольшой форме."
    - "Холодное масло перетрите с хлопьями, мукой и сахаром до крупной крошки. Распределите её поверх яблок."
    - "Выпекайте при 190 °C 25–30 минут, пока яблоки не станут мягкими, а крошка не подрумянится. Дайте постоять 5 минут."
grushi-s-yogurtom:
  portions: 4
  minutes: 35
  steps:
    - "Разрежьте груши вдоль, вырежьте сердцевины. Положите половинки срезом вверх в форму, посыпьте корицей и влейте воду на дно."
    - "Запекайте при 190 °C 22–28 минут до мягкости. Дайте грушам немного остыть и подайте по половинке с натуральным йогуртом без добавок."
shokoladniy-puding:
  portions: 4
  minutes: 20
  timeNote: плюс 1–2 часа на охлаждение
  steps:
    - "Смешайте какао, крахмал и сахар. Влейте примерно четверть холодного молока и размешайте венчиком до однородности."
    - "Добавьте остальное молоко и поставьте на средний огонь. Непрерывно помешивая, доведите до первых пузырьков и варите около минуты до загустения."
    - "Разлейте в небольшие креманки, немного остудите и уберите в холодильник на 1–2 часа."
detskaya-ovsyanka-grusha:
  portions: 2
  minutes: 20
  steps:
    - "Очистите грушу, удалите сердцевину и мелко нарежьте. Потушите в части воды под крышкой 6–8 минут до мягкости и разомните."
    - "Доведите молоко с оставшейся водой до слабого кипения. Всыпьте хлопья и варите, помешивая, до мягкости по времени на упаковке. Вмешайте грушу и дайте каше остыть до тёплой."
detskie-tefteli-indeyka:
  portions: 4
  minutes: 40
  steps:
    - "Замочите хлопья в указанном количестве воды на 5 минут и смешайте с фаршем. Сформуйте тефтели диаметром около 3 см и готовьте на пару примерно 15–20 минут с момента появления пара. Термощуп в центре самой крупной тефтели должен показать минимум 74 °C."
    - "Морковь и картофель нарежьте и варите в воде до мягкости около 20 минут. Слейте воду, оставив немного отвара. Разомните овощи с маслом и добавьте столько отвара, чтобы получилось мягкое пюре."
detskiy-omlet-kabachok:
  portions: 2
  minutes: 30
  steps:
    - "Натрите кабачок мелко и слегка отожмите. Смешайте яйца с молоком, добавьте кабачок."
    - "Смажьте небольшую форму маслом, вылейте смесь и поставьте в разогретую до 180 °C духовку. Запекайте примерно 18–22 минуты. Середина должна полностью схватиться. Проверьте её термощупом — минимум 71 °C."
detskaya-treska-pyure:
  portions: 2
  minutes: 30
  steps:
    - "Очистите картофель и морковь, нарежьте, сварите до мягкости за 15–20 минут. Слейте воду и разомните с тёплым молоком и маслом."
    - "Проверьте филе на кости. Готовьте на пару примерно 10–15 минут с момента появления пара, в зависимости от толщины куска. Проверьте термощупом самое толстое место — минимум 63 °C. Дайте рыбе немного остыть, разберите на хлопья и проверьте на кости ещё раз."

# Бабушкины рецепты
semeinyi-kartofelnyi-graten:
  portions: 8
  minutes: 70
  steps:
    - "Очистите картофель и нарежьте ломтиками толщиной 2–3 мм. Снимите с апельсина несколько тонких полосок цедры без белого слоя. Разрежьте стручок ванили вдоль, чеснок очистите и слегка раздавите."
    - "Нагрейте молоко с чесноком, цедрой, ванилью и щепоткой мускатного ореха почти до кипения. Выньте цедру, ваниль и чеснок, посолите и поперчите. Добавьте картофель и варите на слабом огне 8–12 минут до полуготовности, осторожно перемешивая."
    - "Смажьте широкую форму маслом. Разложите картофель с молоком, в котором он варился, и посыпьте тёртым сыром. Запекайте при 160 °C 30–40 минут. Гратен готов, когда сыр подрумянился, а нож легко входит в картофель в центре."
babushkiny-bliny-na-kefire:
  portions: 4
  minutes: 40
  steps:
    - "Размешайте яйца с сахаром и щепоткой соли. Добавьте кефир и половину воды холодной. Муку смешайте с содой и вмешайте венчиком, чтобы в тесте не осталось комков."
    - "Оставшуюся воду доведите до кипения и влейте тонкой струёй, непрерывно помешивая. Добавьте растительное масло, оставив немного для сковороды. Тесто должно свободно растекаться."
    - "Слегка смажьте и хорошо разогрейте сковороду. Налейте немного теста и распределите тонким слоем. Когда края схватятся, переверните блин и допеките вторую сторону."
sdobnye-grechnevye-bliny:
  portions: 8
  minutes: 135
  steps:
    - "Подогрейте половину молока до тёплого состояния. Смешайте гречневую муку с дрожжами или разведите дрожжи в молоке по инструкции на упаковке. Соедините муку и молоко, накройте и оставьте в тепле до заметного подъёма и пузырьков."
    - "Вмешайте оставшееся тёплое молоко и пшеничную муку. Накройте и снова дайте тесту подняться. Разотрите желтки с сахаром, щепоткой соли и растопленным остывшим маслом, оставив немного масла для сковороды. Вмешайте желтки в тесто."
    - "Взбейте холодные сливки жирностью от 30% и отдельно взбейте белки. Осторожно вмешайте сначала сливки, затем белки. Оставьте тесто на 15–20 минут."
    - "Набирайте тесто половником с поверхности, сохраняя пузырьки. Пеките блины с обеих сторон на хорошо разогретой, слегка смазанной маслом сковороде."
datskii-pirog-s-revenem:
  portions: 8
  minutes: 65
  wholeBatch: true
  steps:
    - "Возьмите только стебли ревеня. Промойте, нарежьте кусочками по 1–2 см, присыпьте частью сахара и оставьте на 10 минут. Застелите форму бумагой для выпечки. Для одной партии подойдёт круглая форма около 22 см."
    - "Порубите орехи и прогрейте с молоком, маслом и щепоткой ванилина до первых пузырьков. Снимите с огня и остудите."
    - "Взбейте яйца с оставшимся сахаром до светлой пены. Вмешайте муку с разрыхлителем и ревень. Выложите тесто в форму, сверху распределите ореховую смесь."
    - "Выпекайте при 170 °C около 40 минут. Шпажка из бисквита должна выйти без сырого теста. Остудите пирог 10–15 минут в форме. Его можно подать тёплым со сметаной."
babushkiny-zavarnye-pelmeni:
  portions: 4
  minutes: 95
  steps:
    - "Добавьте к муке щепотку соли. Влейте большую часть кипятка и размешайте ложкой. Когда масса немного остынет, вымесите руками, добавляя оставшуюся воду по необходимости. Гладкое тесто накройте и оставьте на 25 минут."
    - "Пропустите говядину, свинину и лук через мясорубку, добавьте молоко, соль и перец. Перемешайте и уберите фарш в холодильник до лепки."
    - "Тонко раскатайте тесто, вырежьте кружки и положите на каждый немного начинки. Плотно защипните края полумесяцем, затем соедините концы. Обрезки можно раскатать повторно."
    - "Варите свежие пельмени партиями в подсоленной воде при слабом кипении. После всплытия варите ещё примерно 4–6 минут. Введите термощуп сбоку в центр начинки самого крупного пельменя. Для фарша из говядины и свинины нужно минимум 71 °C."
syrnye-rafaello:
  portions: 4
  minutes: 25
  steps:
    - "Охладите плотный плавленый сыр и натрите на крупной тёрке. Вмешивайте майонез понемногу, пока смесь не начнёт держать форму."
    - "Мелко натрите крабовые палочки. Разделите сырную массу на небольшие порции, в каждую вложите кусочек грецкого ореха и скатайте шарик."
    - "Обваляйте шарики в стружке из крабовых палочек и охладите до подачи."
truhlyavyi-pen-s-suhofruktami:
  portions: 10
  minutes: 95
  wholeBatch: true
  timeNote: плюс ночь в холодильнике
  steps:
    - "Залейте сухофрукты без косточек горячей водой на 10–15 минут. Слейте воду и измельчите чернослив, курагу и изюм по отдельности. Если начинка плохо намазывается, добавьте немного горячей воды, чтобы получилась густая паста."
    - "На одну партию отложите 650 г сметаны и 160 г сахара для крема. Размешайте яйцо с оставшимся сахаром и сметаной для теста. Смешайте муку с содой и вмешайте порциями, пока тесто не станет мягким и перестанет липнуть к рукам."
    - "На одну партию разделите тесто на 8 частей. Раскатайте лепёшки и сверните 2 рулета с черносливом, 3 с курагой и 3 с изюмом. Пеките швом вниз на пергаменте при 180 °C до золотистого цвета, начиная проверять через 18 минут. Полностью остудите."
    - "Взбейте отложенную густую сметану с сахаром до его растворения. Остывшие рулеты нарежьте поперёк на кусочки шириной около 3 см. Смажьте дно формы кремом и поставьте кусочки вертикально, срезом вверх. Чередуйте начинки вразнобой и заполняйте кремом промежутки. Промажьте первый слой и поставьте сверху следующий, смещая кусочки, чтобы стыки слоёв не совпадали."
    - "Распределите сверху немного крема тонким неровным слоем. Уберите торт в холодильник на ночь. После снятия формы можно слегка промазать бока остатком крема, оставляя выпечку видимой."
tort-rezekne-yabloki:
  portions: 12
  minutes: 105
  wholeBatch: true
  timeNote: плюс не менее 4 часов в холодильнике
  steps:
    - "На одну партию возьмите 300 г масла для теста, остальное оставьте для крема. Порубите холодное масло с мукой и сахаром до крошки. Добавьте яйца, быстро соберите тесто и охладите около часа."
    - "Раскрошите тесто на противень с пергаментом. Выпекайте при 175 °C до равномерного золотистого цвета, перемешав крошку в процессе. Начните проверять через 15 минут. Полностью остудите."
    - "Нарежьте яблоки и потушите под крышкой до мягкости. Снимите крышку и выпарите лишний сок. Добавьте мелко натёртую жёлтую цедру лимона и полностью остудите начинку."
    - "Взбейте оставшееся размягчённое масло, постепенно добавляя готовую варёную сгущёнку. Перемешайте крем с остывшей крошкой и разделите массу пополам. Слегка уплотните первый слой в форме, распределите яблоки и накройте вторым слоем. Охладите не менее 4 часов и украсьте безе."
