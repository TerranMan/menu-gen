# Строки с названиями берут количество из основного состава блюда.
# Для домашней замены готового продукта количество задано явно.

pirozhki-s-yaitsom-i-lukom:
  type: Дрожжевое на молоке
  ingredients: [мука, молоко, дрожжи сухие, масло растительное, сахар, соль]
  steps:
    - Перемешайте дрожжи и сахар с тёплым молоком. Если на упаковке дрожжей рекомендовано смешивать их с мукой, добавьте их к муке.
    - Всыпьте муку и соль, добавьте растительное масло. Вымешивайте 7–10 минут до гладкости.
    - Накройте и дайте тесту подняться в тепле до увеличения примерно вдвое. Яйца из основного состава оставьте для начинки и смазывания.

pirozhki-s-yablokom:
  type: Сдобное дрожжевое с яйцом
  ingredients:
    - мука
    - молоко
    - дрожжи сухие
    - яйцо
    - масло растительное
    - { name: сахар, qty: 2, unit: ст.л. }
    - соль
  steps:
    - Соедините тёплое молоко с яйцом и сахаром для теста. Добавьте дрожжи согласно инструкции на упаковке.
    - Вмешайте муку и соль, в конце добавьте масло. Вымесите до гладкости и оставьте под крышкой до увеличения примерно вдвое.
    - Разделите тесто на порции. Оставшийся сахар из основного состава используйте для яблочной начинки.

sloiki-s-vishnei: &puff
  type: Быстрое слоёное бездрожжевое
  replaces: тесто слоёное
  ingredients:
    - { name: мука, qty: 210, unit: г }
    - { name: масло сливочное, qty: 190, unit: г }
    - { name: вода, qty: 100, unit: мл }
    - { name: соль, qty: 3, unit: г }
  steps:
    - Смешайте муку с солью. Добавьте кубики холодного масла и сплющите их пальцами. Оставьте заметные пластинки масла.
    - Влейте ледяную воду и соберите тесто. Раскатайте в прямоугольник, сложите втрое и поверните на четверть оборота.
    - Повторите раскатку и складывание ещё два раза. Если масло стало мягким, охладите тесто между раскатками.
    - Заверните и охладите минимум 30 минут. Раскатывайте холодным, когда начинка уже готова.

sloiki-s-yablokom-i-koritsei: *puff

sharlotka:
  type: Бисквитное на взбитых яйцах
  ingredients: [яйцо, сахар, мука, ванилин]
  steps:
    - Взбейте яйца с сахаром до густой светлой пены. След от венчика должен держаться несколько секунд.
    - Просейте муку с ванилином и вмешайте лопаткой снизу вверх в два приёма. Сразу вылейте тесто на яблоки в форме.

mannik:
  type: Манное на кефире
  ingredients: [манка, кефир, яйцо, сахар, мука, масло сливочное, разрыхлитель, ванилин]
  steps:
    - Залейте манку кефиром, перемешайте и оставьте на 25–30 минут.
    - Взбейте яйца с сахаром, добавьте набухшую манку и остывшее растопленное масло.
    - Вмешайте просеянную муку с разрыхлителем и ванилином до однородности. Тесто готово к выпечке.

pechene-sdobnoe:
  type: Песочное на сливочном масле
  ingredients: [мука, масло сливочное, сахар, яйцо, разрыхлитель, ванилин, соль]
  steps:
    - Разотрите мягкое масло с сахаром, добавьте яйцо, соль и ванилин.
    - Всыпьте муку с разрыхлителем и быстро соберите тесто. Охладите примерно 20 минут, затем сформуйте печенье.

keks:
  type: Масляное кексовое
  ingredients: [мука, сахар, яйцо, масло сливочное, молоко, разрыхлитель, ванилин]
  steps:
    - Взбейте мягкое масло с сахаром до светлой пышной массы. Вмешивайте яйца небольшими порциями.
    - Просейте муку с разрыхлителем и ванилином. Добавляйте мучную смесь и молоко поочерёдно, перемешивая до однородности.
    - Перед выпечкой вмешайте обсушенный изюм из основного состава.

chebureki:
  type: Пресное на воде
  ingredients: [мука, вода, соль]
  steps:
    - Растворите соль в воде комнатной температуры. Постепенно влейте воду в муку и замесите плотное гладкое тесто.
    - Накройте на 20–30 минут. Разделите тесто на шарики и раскатайте в тонкие круги перед наполнением.

pirog-s-persikami:
  type: Сдобное заливное для пирога
  ingredients: [мука, сахар, яйцо, масло сливочное, разрыхлитель, ванилин]
  steps:
    - Разотрите мягкое масло с сахаром. По одному вмешайте яйца комнатной температуры.
    - Просейте муку с разрыхлителем и ванилином, перемешайте лопаткой до исчезновения сухих участков.
    - Выложите густое тесто в форму и разровняйте перед тем, как разложить персики.

blini:
  type: Жидкое блинное на молоке
  ingredients: [мука, молоко, яйцо, сахар, масло растительное, соль]
  steps:
    - Размешайте яйца с сахаром, солью и половиной молока. Всыпьте муку и вымешайте венчиком до гладкости.
    - Влейте остальное молоко и масло. Дайте постоять 10 минут, затем перемешайте перед жаркой.

oladi:
  type: Густое на кефире с содой
  ingredients: [мука, кефир, яйцо, сахар, сода, соль]
  steps:
    - Соедините кефир, яйца, сахар и соль. Отдельно перемешайте муку с содой.
    - Быстро соедините сухую смесь с жидкой. Дайте густому тесту постоять 5 минут и берите ложкой для жарки. Масло из основного состава понадобится для сковороды.

sirniki:
  type: Творожное для сырников
  ingredients:
    - творог
    - яйцо
    - сахар
    - ванилин
    - { name: мука, qty: 3, unit: ст.л. }
  steps:
    - Разомните творог вилкой. Если в нём много сыворотки, предварительно дайте ей стечь.
    - Вмешайте яйцо, сахар и ванилин, затем муку для теста. Сформуйте сырники и обваляйте в остальной муке из основного состава.

lagman:
  type: Пресное вытяжное для лагмана
  replaces: лапша
  ingredients:
    - { name: мука, qty: 300, unit: г }
    - { name: вода, qty: 155, unit: мл }
    - { name: соль, qty: 4, unit: г }
    - { name: масло растительное, qty: 15, unit: мл }
  steps:
    - Растворите соль в воде, добавьте её в муку и вымесите гладкое тесто. Накройте и оставьте на 30 минут.
    - Нарежьте полосками, скатайте тонкие жгуты и смажьте маслом. Накройте ещё на 20 минут, чтобы жгуты стали эластичнее.
    - Постепенно растяните каждый жгут руками, двигаясь от середины к краям. Отварите свежую лапшу отдельно до мягкости и подайте с подливой.

pelmeni:
  type: Пресное пельменное с яйцом
  replaces: пельмени
  ingredients:
    - { name: мука, qty: 160, unit: г }
    - { name: вода, qty: 65, unit: мл }
    - { name: яйцо, qty: 0.5, unit: шт }
    - { name: соль, qty: 2, unit: г }
  steps:
    - Разболтайте яйцо и отмерьте нужную часть. Смешайте с водой и солью, влейте в муку и замесите плотное тесто.
    - Накройте и дайте отдохнуть 30 минут. Тонко раскатайте, вырежьте кружки и используйте для домашних пельменей с выбранной начинкой.

makaroni:
  type: Пресное из твёрдой пшеницы
  replaces: макароны
  ingredients:
    - { name: семола из твёрдой пшеницы, qty: 140, unit: г }
    - { name: мука, qty: 60, unit: г }
    - { name: вода, qty: 100, unit: мл }
    - { name: соль, qty: 2, unit: г }
  steps:
    - Перемешайте семолу, муку и соль. Влейте тёплую воду и вымесите плотное, но пластичное тесто.
    - Накройте и оставьте на 30 минут. Тонко раскатайте и нарежьте короткими полосками или небольшими ромбами.
    - Отварите свежие макароны в подсоленной воде. Начните проверять готовность через 2–3 минуты.

lapsha:
  type: Яичное для домашней лапши
  replaces: лапша
  ingredients:
    - { name: мука, qty: 200, unit: г }
    - { name: яйцо, qty: 2, unit: шт }
    - { name: соль, qty: 2, unit: г }
  steps:
    - Вмешайте яйца и соль в муку. Вымешивайте 8–10 минут. Если тесто крошится, добавляйте воду по нескольку капель.
    - Накройте и оставьте на 30 минут. Тонко раскатайте, присыпьте мукой и нарежьте полосками.
    - Варите свежую лапшу несколько минут, пробуя по готовности.

kurinaya-lapsha:
  type: Крутое яичное для тонкой суповой лапши
  replaces: лапша
  ingredients:
    - { name: мука, qty: 150, unit: г }
    - { name: яйцо, qty: 1, unit: шт }
    - { name: вода, qty: 20, unit: мл }
    - { name: соль, qty: 2, unit: г }
  steps:
    - Смешайте яйцо, воду и соль. Влейте в муку и вымесите крутое тесто до гладкости.
    - Накройте на 30 минут, затем раскатайте до толщины около 1 мм. Подпылите мукой и нарежьте тонкими полосками.
    - Стряхните лишнюю муку, опустите лапшу в кипящий бульон и проверьте готовность через пару минут. Яйцо из основного состава оставьте для супа.
