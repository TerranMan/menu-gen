<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c0392b" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Генератор меню</title>
  </head>
  <body>
    <div class="app" x-data="menuApp" x-cloak @focus.window="refreshToday()">
      <header class="top">
        <h1>🍽️ Меню на неделю</h1>
        <div class="persons" role="group" aria-label="Количество персон">
          <button
            type="button"
            class="btn-step"
            :disabled="state.persons <= minPersons"
            @click="decPersons()"
            aria-label="Меньше персон"
          >−</button>
          <span class="persons-count" x-text="state.persons" aria-live="polite"></span>
          <button
            type="button"
            class="btn-step"
            :disabled="state.persons >= maxPersons"
            @click="incPersons()"
            aria-label="Больше персон"
          >+</button>
          <span class="persons-label">персон</span>
        </div>
        <div class="toolbar" x-show="view === 'menu'">
          <button class="btn primary" @click="regenerateAll()">Сгенерировать заново</button>
        </div>
      </header>

      <nav class="view-nav" x-ref="viewNav" aria-label="Разделы меню">
        <button type="button" :aria-pressed="view === 'menu'" @click="showView('menu')">Подборка</button>
        <button type="button" :aria-pressed="view === 'today'" @click="showView('today')">Сегодня</button>
        <button type="button" :aria-pressed="view === 'week'" @click="showView('week')">По дням</button>
        <button type="button" :aria-pressed="view === 'catalog'" @click="showView('catalog')">Каталог</button>
        <a href="#shopping" @click.prevent="openShopping()">Покупки</a>
      </nav>

      <main>
      <div x-show="view === 'menu'">
      <template x-for="slot in menu" :key="slot.categoryId">
        <section class="category">
          <h2>
            <span class="category-title" x-text="slot.categoryName"></span>
            <span class="cat-stepper" role="group" :aria-label="`Блюд в категории ${slot.categoryName}`">
              <button
                type="button"
                class="btn-step btn-step-sm"
                :disabled="effectivePick(slot.categoryId) <= pinnedCount(slot.categoryId)"
                @click="decPick(slot.categoryId)"
                aria-label="Меньше блюд"
              >−</button>
              <span class="cat-stepper-count" x-text="slot.dishes.length" aria-live="polite"></span>
              <button
                type="button"
                class="btn-step btn-step-sm"
                :disabled="effectivePick(slot.categoryId) >= availableCount(slot.categoryId)"
                @click="incPick(slot.categoryId)"
                aria-label="Больше блюд"
              >+</button>
            </span>
          </h2>
          <template x-if="slot.dishes.length === 0 && effectivePick(slot.categoryId) === 0">
            <p class="empty-hint">Категория отключена.</p>
          </template>
          <template x-if="slot.dishes.length < effectivePick(slot.categoryId)">
            <p class="empty-hint" x-text="`Подобрано ${slot.dishes.length} из ${effectivePick(slot.categoryId)}. Снимите блокировки, чтобы добавить блюда.`"></p>
          </template>
          <template x-for="dish in slot.dishes" :key="dish.id">
            <div class="dish-block" x-data="{ imageFailed: false }">
              <div class="dish-row">
                <template x-if="dish.image && !imageFailed">
                  <img class="dish-img" :src="imageUrl(dish.image)" :alt="dish.name" loading="lazy" @error="imageFailed = true" />
                </template>
                <template x-if="!dish.image || imageFailed">
                  <span class="dish-emoji-big" x-text="dishEmoji(dish, slot.categoryId)"></span>
                </template>
                <button
                  type="button"
                  class="dish-name-toggle"
                  :aria-expanded="isExpanded(dish.id)"
                  :aria-controls="`recipe-${dish.id}`"
                  @click="toggleExpanded(dish.id)"
                >
                  <span class="dish-name" x-text="dish.name"></span>
                  <span class="chevron" :class="{ open: isExpanded(dish.id) }">▸</span>
                </button>
                <div class="dish-actions">
                  <button
                    type="button"
                    class="icon-btn pin-btn"
                    :class="{ active: isPinned(dish.id) }"
                    :aria-pressed="isPinned(dish.id)"
                    :aria-label="isPinned(dish.id) ? 'Открепить блюдо' : 'Закрепить блюдо'"
                    :title="isPinned(dish.id) ? 'Открепить блюдо' : 'Закрепить блюдо'"
                    @click="togglePin(dish.id)"
                  >📌</button>
                  <button
                    class="icon-btn"
                    :class="{ active: isFavorite(dish.id) }"
                    :title="isFavorite(dish.id) ? 'Убрать из избранного' : 'В избранное'"
                    @click="toggleFavorite(dish.id)"
                  >
                    <span x-text="isFavorite(dish.id) ? '★' : '☆'"></span>
                  </button>
                  <button
                    class="icon-btn"
                    title="Заменить это блюдо"
                    aria-label="Заменить это блюдо"
                    :disabled="isPinned(dish.id) || slot.dishes.length >= availableCount(slot.categoryId)"
                    @click="regenerateOne(slot.categoryId, dish.id)"
                  >↻</button>
                  <button
                    class="icon-btn"
                    title="Не показывать"
                    aria-label="Не показывать"
                    @click="toggleBlock(dish.id)"
                  >✕</button>
                </div>
              </div>
              <template x-if="isExpanded(dish.id)">
                <div class="dish-details" :id="`recipe-${dish.id}`">
                  <p class="recipe-meta" x-text="recipeSummary(dish)"></p>
                  <h3>Состав</h3>
                  <ul class="ingredients-list">
                    <template x-for="ing in scaledIngredients(dish)" :key="ing.name + '__' + ing.unit">
                      <li x-text="formatIngredient(ing)"></li>
                    </template>
                  </ul>
                  <h3>Как приготовить</h3>
                  <ol class="recipe-steps">
                    <template x-for="(step, index) in dish.recipe.steps" :key="index">
                      <li x-text="step"></li>
                    </template>
                  </ol>
                </div>
              </template>
            </div>
          </template>
        </section>
      </template>
      </div>

      <template x-if="view === 'today'">
        <section class="today-view" aria-labelledby="today-heading">
          <div class="view-heading">
            <div>
              <h2 id="today-heading">Сегодня</h2>
              <span class="item-meta today-date" x-text="todayLabel()"></span>
            </div>
            <button class="btn" type="button" @click="openTodayInWeek()">Открыть день в плане</button>
          </div>
          <template x-for="meal in todayMeals()" :key="meal.id">
            <section class="meal-block" :aria-labelledby="`today-${meal.id}`">
              <h3 :id="`today-${meal.id}`" x-text="meal.name"></h3>
              <p class="view-status" x-show="!mealEntries(meal.id).length">В плане пока пусто.</p>
              <ul class="meal-dishes">
                <template x-for="entry in mealEntries(meal.id)" :key="entry.dishId">
                  <li>
                    <div>
                      <button type="button" class="text-button"
                        @click="openRecipe(entry.dish, portionCount(entry.from ?? meal.id, entry.dishId))"
                        x-text="entry.dish.name"></button>
                      <span class="item-meta" x-text="mealDishNote(meal.id, entry)"></span>
                      <span class="item-meta"
                        x-show="entry.from || recipeYield(entry.dish, portionCount(meal.id, entry.dishId)) > state.persons"
                        x-text="`Подать сегодня · ${formatPortions(state.persons)}`"></span>
                    </div>
                  </li>
                </template>
              </ul>
            </section>
          </template>
        </section>
      </template>

      <template x-if="view === 'week'">
        <section class="week-view" aria-label="План на неделю">
          <div class="view-heading">
            <h2>План на неделю</h2>
            <button class="btn" type="button" @click="openHistory()">История недель</button>
          </div>
          <div class="week-actions">
            <button class="btn primary" type="button" @click="fillSchedule()">Заполнить пустые приёмы</button>
            <button class="btn" type="button" @click="distributeSelection()">Разложить подборку</button>
            <button class="btn" type="button" @click="openNewWeek()">Новая неделя</button>
            <button class="btn" type="button" :disabled="!hasWeekPlan()" @click="openWeekShare()">Поделиться неделей</button>
          </div>
          <p class="view-status" aria-live="polite" x-show="plannerMessage" x-text="plannerMessage"></p>
          <div class="day-nav" role="group" aria-label="Дни недели">
            <template x-for="day in days" :key="day.id">
              <button type="button" :aria-label="day.name" :aria-pressed="dayId === day.id" @click="dayId = day.id"
                x-text="day.short"></button>
            </template>
          </div>
          <h3 class="day-heading" x-text="activeDay().name"></h3>
          <template x-for="meal in currentMeals()" :key="meal.id">
            <section class="meal-block" :aria-labelledby="`meal-${meal.id}`">
              <h4 :id="`meal-${meal.id}`" x-text="meal.name"></h4>
              <ul class="meal-dishes">
                <template x-for="entry in mealEntries(meal.id)" :key="entry.dishId">
                  <li>
                    <div>
                      <button type="button" class="text-button"
                        @click="openRecipe(entry.dish, portionCount(entry.from ?? meal.id, entry.dishId))"
                        x-text="entry.dish.name"></button>
                      <span class="item-meta" x-text="mealDishNote(meal.id, entry)"></span>
                    </div>
                    <button type="button" class="icon-btn" :aria-label="`Убрать ${entry.dish.name} из приёма`"
                      @click="removeMealDish(meal.id, entry.dishId)">×</button>
                  </li>
                </template>
              </ul>
              <div class="meal-actions">
                <button class="btn" type="button" @click="openCatalog(meal.id)">Добавить блюдо</button>
                <template x-if="reusableBatches(meal.id).length">
                  <select class="field" aria-label="Из готовой партии"
                    @change="reuseBatch(meal.id, $event.target.value); $event.target.value = ''">
                    <option value="">Из готовой партии…</option>
                    <template x-for="batch in reusableBatches(meal.id)" :key="batch.key">
                      <option :value="batch.key" x-text="batch.label"></option>
                    </template>
                  </select>
                </template>
              </div>
            </section>
          </template>
        </section>
      </template>

      <template x-if="view === 'catalog'">
        <section class="catalog-view" aria-label="Каталог блюд">
          <div class="view-heading">
            <h2 x-text="catalogTarget ? `Выбрать блюдо · ${mealLabel(catalogTarget)}` : 'Каталог блюд'"></h2>
            <button type="button" class="btn" x-show="catalogTarget" @click="showView('week')">К расписанию</button>
          </div>
          <div class="catalog-filters">
            <input class="field" type="search" aria-label="Поиск по названию" placeholder="Поиск по названию" x-model="catalogQuery" />
            <select class="field" aria-label="Категория" x-model="catalogCategory">
              <option value="">Все категории</option>
              <template x-for="category in data.categories" :key="category.id">
                <option :value="category.id" x-text="category.name"></option>
              </template>
            </select>
          </div>
          <p class="view-status" x-show="!catalogEntries().length">По этим условиям блюд нет.</p>
          <ul class="catalog-dishes">
            <template x-for="entry in catalogEntries()" :key="entry.dish.id">
              <li x-data="{ imageFailed: false }">
                <button class="catalog-preview" type="button" @click="openRecipe(entry.dish)">
                  <template x-if="entry.dish.image && !imageFailed">
                    <img class="dish-img" :src="imageUrl(entry.dish.image)" alt="" loading="lazy" @error="imageFailed = true" />
                  </template>
                  <template x-if="!entry.dish.image || imageFailed">
                    <span class="dish-emoji-big" aria-hidden="true" x-text="dishEmoji(entry.dish, entry.categoryId)"></span>
                  </template>
                  <span>
                    <strong x-text="entry.dish.name"></strong>
                    <span class="item-meta" x-text="`${entry.categoryName} · ${entry.dish.recipe.minutes} мин`"></span>
                  </span>
                </button>
                <template x-if="!catalogTarget && catalogHasDish(entry)">
                  <button type="button" class="btn" :aria-pressed="isPinned(entry.dish.id)"
                    @click="togglePin(entry.dish.id)" x-text="isPinned(entry.dish.id) ? 'Открепить' : 'Закрепить'"></button>
                </template>
                <template x-if="catalogTarget || !catalogHasDish(entry)">
                  <button type="button" class="btn" :disabled="isBlocked(entry.dish.id) || catalogHasDish(entry)"
                    @click="chooseCatalogDish(entry)"
                    x-text="catalogHasDish(entry) ? 'Добавлено' : isBlocked(entry.dish.id) ? 'Заблокировано' : 'Добавить в меню'"></button>
                </template>
              </li>
            </template>
          </ul>
        </section>
      </template>

      <div class="lists" x-show="view !== 'catalog'">
        <details id="shopping" x-ref="shopping" open>
          <summary>
            🛒 Список покупок (<span x-text="shoppingList().length"></span>) —
            <span x-text="weekTotal().text"></span>
            <span class="missing-hint" x-show="weekTotal().missing > 0"
              x-text="`+ ${weekTotal().missing} без цены`"></span>
          </summary>
          <div class="shopping-toolbar">
            <span class="item-meta" x-text="state.view === 'menu' ? 'По подборке' : 'По плану недели'"></span>
            <div class="shopping-actions">
              <button class="btn" type="button" @click="openStock()">Запасы дома</button>
              <button class="btn" type="button" :disabled="!shoppingList().length" @click="copyShopping()">Копировать список</button>
            </div>
          </div>
          <p class="view-status" aria-live="polite" x-show="copyMessage" x-text="copyMessage"></p>
          <textarea class="field copy-field" aria-label="Текст списка покупок" x-show="copyText" x-ref="copyField"
            :value="copyText" readonly></textarea>
          <p class="view-status" x-show="!shoppingList().length"
            x-text="requiredIngredients(state.view).length ? 'По этому меню всё есть дома.' : 'Добавьте блюда, чтобы составить список.'"></p>
          <template x-for="group in shoppingGroups()" :key="group.name">
            <section class="shopping-group">
              <h3 x-text="group.name"></h3>
              <ul class="shopping">
                <template x-for="ing in group.items" :key="ing.key">
              <li>
                <div>
                  <label class="shopping-item">
                    <input type="checkbox" :checked="ing.checked" @change="setChecked(ing, $event.target.checked)" />
                    <span class="shopping-name" x-text="ing.text"></span>
                  </label>
                  <span class="item-meta stock-note" x-show="ing.stockText" x-text="ing.stockText"></span>
                </div>
                <div class="shopping-price" x-show="ing.unit !== 'по вкусу'">
                  <input
                    type="number"
                    inputmode="decimal"
                    min="0"
                    step="any"
                    :aria-label="`Цена за 1 ${ing.unit} · ${ing.name}`"
                    :class="{ 'is-default': ing.isDefault }"
                    :placeholder="`₽/${ing.unit}`"
                    :value="priceFor(ing.key)"
                    @input.debounce.400ms="setPrice(ing.key, $event.target.value)"
                  />
                  <span class="shopping-cost" x-text="ing.cost != null ? `= ${ing.cost} ₽` : ''"></span>
                </div>
              </li>
                </template>
              </ul>
            </section>
          </template>
        </details>

        <details>
          <summary>
            ★ Избранное (<span x-text="state.favorites.length"></span>)
          </summary>
          <template x-if="favoriteDishes().length === 0">
            <p class="empty-hint">Пусто. Нажмите ☆ у блюда чтобы добавить.</p>
          </template>
          <ul>
            <template x-for="d in favoriteDishes()" :key="d.id">
              <li>
                <span x-text="d.name"></span>
                <button class="icon-btn" @click="toggleFavorite(d.id)" title="Убрать">✕</button>
              </li>
            </template>
          </ul>
        </details>

        <details>
          <summary>
            ✕ Заблокировано (<span x-text="state.blocks.length"></span>)
          </summary>
          <template x-if="blockedDishes().length === 0">
            <p class="empty-hint">Пусто.</p>
          </template>
          <ul>
            <template x-for="d in blockedDishes()" :key="d.id">
              <li>
                <span x-text="d.name"></span>
                <button class="icon-btn" @click="toggleBlock(d.id)" title="Вернуть" aria-label="Вернуть">↺</button>
              </li>
            </template>
          </ul>
        </details>
      </div>
      </main>

      <dialog class="week-dialog" x-ref="newWeekDialog" aria-labelledby="new-week-title">
        <div class="view-heading">
          <h2 id="new-week-title">Новая неделя</h2>
          <button type="button" class="icon-btn" aria-label="Закрыть" autofocus @click="$refs.newWeekDialog.close()">×</button>
        </div>
        <div x-show="hasWeekPlan()">
          <p>Текущий план сохранится в истории.</p>
          <label class="archive-name">
            Название сохраняемого плана
            <input class="field" type="text" maxlength="60" placeholder="Можно оставить пустым" x-model="archiveName" />
          </label>
        </div>
        <div class="week-actions">
          <button type="button" class="btn primary" @click="startNewWeek(false)">Начать с пустого плана</button>
          <button type="button" class="btn" x-show="hasWeekPlan()" @click="startNewWeek(true)">Скопировать текущий план</button>
        </div>
        <p class="view-status" role="alert" x-show="weekStorageError" x-text="weekStorageError"></p>
      </dialog>

      <dialog class="week-dialog" x-ref="historyDialog" aria-labelledby="history-title">
        <div class="view-heading">
          <h2 id="history-title">История недель</h2>
          <button type="button" class="icon-btn" aria-label="Закрыть" autofocus @click="$refs.historyDialog.close()">×</button>
        </div>
        <p class="view-status" x-show="!state.weekHistory.length">Сохранённые планы появятся здесь после начала новой недели.</p>
        <p class="view-status" role="alert" x-show="weekStorageError" x-text="weekStorageError"></p>
        <template x-for="entry in state.weekHistory" :key="entry.id">
          <details class="history-week">
            <summary>
              <strong x-text="historyLabel(entry)"></strong>
              <span class="item-meta" x-show="entry.name" x-text="historyDate(entry)"></span>
            </summary>
            <p class="item-meta" x-text="`Персон — ${entry.persons}`"></p>
            <ul class="history-meals">
              <template x-for="line in historyLines(entry)" :key="line.id">
                <li><span class="item-meta" x-text="line.label"></span><span x-text="line.dishes"></span></li>
              </template>
            </ul>
            <p class="item-meta" x-show="hasWeekPlan()">Текущий план тоже сохранится в истории.</p>
            <button class="btn" type="button" @click="copyHistoryWeek(entry)">Скопировать в новую неделю</button>
          </details>
        </template>
      </dialog>

      <dialog class="week-dialog" x-ref="stockDialog" aria-labelledby="stock-title">
        <div class="view-heading">
          <h2 id="stock-title">Запасы дома</h2>
          <button type="button" class="icon-btn" aria-label="Закрыть" autofocus @click="$refs.stockDialog.close()">×</button>
        </div>
        <form class="stock-form" @submit.prevent="updateStock(stockKey, stockAmount)">
          <label>
            Продукт
            <select class="field" :value="stockKey" @change="selectStock($event.target.value)" required>
              <option value="">Выберите продукт</option>
              <template x-for="group in stockGroups" :key="group.name">
                <optgroup :label="group.name">
                  <template x-for="item in group.items" :key="item.key">
                    <option :value="item.key" x-text="`${item.name} · ${item.unit}`"></option>
                  </template>
                </optgroup>
              </template>
            </select>
          </label>
          <label>
            <span x-text="stockUnit() ? `Остаток · ${stockUnit()}` : 'Остаток'"></span>
            <input class="field" type="number" inputmode="decimal" min="0"
              :step="['г', 'мл'].includes(stockUnit()) ? '0.1' : '1'" x-model="stockAmount" :disabled="!stockKey" required />
          </label>
          <button class="btn primary" type="submit" :disabled="!stockKey">Сохранить остаток</button>
        </form>
        <p class="view-status" role="status" x-show="stockMessage" x-text="stockMessage"></p>
        <ul class="stock-items">
          <template x-for="item in stockedItems()" :key="item.key">
            <li>
              <button type="button" class="text-button" @click="selectStock(item.key)"
                :aria-label="`Изменить остаток · ${item.name}`" x-text="item.text"></button>
              <button type="button" class="icon-btn" :aria-label="`Убрать из запасов · ${item.name}`"
                @click="updateStock(item.key, 0)">×</button>
            </li>
          </template>
        </ul>
      </dialog>

      <dialog class="week-dialog" x-ref="shareDialog" aria-labelledby="share-title">
        <div class="view-heading">
          <h2 id="share-title">Поделиться неделей</h2>
          <button type="button" class="icon-btn" aria-label="Закрыть" autofocus @click="$refs.shareDialog.close()">×</button>
        </div>
        <textarea class="field copy-field week-share-field" aria-label="Расписание и список покупок"
          x-ref="shareField" :value="shareText" readonly></textarea>
        <div class="week-actions">
          <button type="button" class="btn primary" @click="copyWeek()">Копировать неделю</button>
          <button type="button" class="btn" x-show="canShareWeek()" @click="shareWeek()">Отправить…</button>
        </div>
        <p class="view-status" role="status" x-show="shareMessage" x-text="shareMessage"></p>
      </dialog>

      <dialog class="recipe-dialog" x-ref="recipeDialog" aria-labelledby="preview-title" @close="recipePreview = null">
        <template x-if="recipePreview">
          <div>
            <div class="view-heading">
              <h2 id="preview-title" x-text="recipePreview.dish.name"></h2>
              <button type="button" class="icon-btn" aria-label="Закрыть рецепт" autofocus @click="$refs.recipeDialog.close()">×</button>
            </div>
            <img class="recipe-photo" x-show="recipePreview.dish.image && !imageFailed"
              x-data="{ imageFailed: false }" :src="imageUrl(recipePreview.dish.image)" :alt="recipePreview.dish.name"
              @error="imageFailed = true" />
            <p class="recipe-meta" x-text="recipeSummary(recipePreview.dish, recipePreview.servings)"></p>
            <h3>Состав</h3>
            <ul class="ingredients-list">
              <template x-for="ing in scaledIngredients(recipePreview.dish, recipePreview.servings)" :key="ing.name + '__' + ing.unit">
                <li x-text="formatIngredient(ing)"></li>
              </template>
            </ul>
            <h3>Как приготовить</h3>
            <ol class="recipe-steps">
              <template x-for="(step, index) in recipePreview.dish.recipe.steps" :key="index">
                <li x-text="step"></li>
              </template>
            </ol>
          </div>
        </template>
      </dialog>

      <footer class="bottom">
        <span x-text="`${data.categories.reduce((s, c) => s + c.dishes.length, 0)} блюд в базе`"></span>
      </footer>
    </div>

    <style>
      [x-cloak] { display: none !important; }
    </style>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
