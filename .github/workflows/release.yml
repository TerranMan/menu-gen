name: Build Windows exe (Tauri)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build installers
        working-directory: app
        run: npm run tauri -- build

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: installers

      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem -Path installers -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' })
          if (-not ($assets.Extension -contains '.msi') -or -not ($assets.Extension -contains '.exe')) {
            throw 'Both Windows installer formats are required.'
          }
          $paths = @($assets | ForEach-Object FullName)
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @paths --clobber
          } else {
            gh release create $env:RELEASE_TAG @paths --verify-tag --title "Menu Gen $env:RELEASE_TAG" --notes 'Скачайте установщик .msi или setup.exe ниже.'
          }
          exit $LASTEXITCODE
